<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeaseDesk · Prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@700&display=swap">
<style>
:root{
  --bg:#f5f5f2;--surface:#fff;--ink:#121212;--ink2:#4f4d48;--muted:#8b8881;--line:#e6e4de;--line2:#efeee9;
  --accent:#2a78d6;--accent-2:#1f5fb0;--accent-soft:#e8f1fc;--series-2:#eb6834;
  --warn:#946000;--warn-soft:#fdf3dc;--danger:#c23b3a;--danger-soft:#fbe9e8;--ok:#1d7a52;--ok-soft:#e3f4ec;
  --r:14px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{display:block}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes rise{from{height:0}}
@keyframes draw{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,120,214,.45)}70%{box-shadow:0 0 0 6px rgba(42,120,214,0)}100%{box-shadow:0 0 0 0 rgba(42,120,214,0)}}
.anim .a{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
.anim.view{animation:fadeIn .3s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:10px 20px;background:rgba(245,245,242,.82);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:-.04em;font-size:17px}
.logo i{font-style:normal;color:var(--accent)}
.seg{display:inline-flex;background:#e9e8e3;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--ink2);font-weight:500;transition:background .25s var(--ease),color .2s,box-shadow .25s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.sm button{padding:4px 9px;font-size:12.5px}
.tools{display:flex;align-items:center;gap:4px;margin-left:auto}
.today{font-weight:700;font-variant-numeric:tabular-nums;padding:0 8px}

/* ---------- buttons / chips ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#d2cfc6;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#2b2b2b}
.btn.blue{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:#e9e8e3;box-shadow:none}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--danger)}
.btn.icon{padding:6px 9px}
.btn[disabled]{opacity:.35;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:#efeee9;color:var(--ink2);white-space:nowrap}
.chip.blue{background:var(--accent-soft);color:var(--accent-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.dark{background:var(--ink);color:#fff}
.chip.line{background:#fff;border:1px solid var(--line)}
.ndot{background:var(--danger);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 57px)}
.side{padding:22px 12px;border-right:1px solid var(--line);position:sticky;top:57px;height:calc(100vh - 57px)}
.me{padding:0 12px 16px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.me b{display:block;font-size:15px}.me span{color:var(--muted);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:500;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.nav button:hover{background:#e9e8e3}
.nav button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.main{padding:28px 34px 100px;max-width:1220px;width:100%;min-width:0}
h1{font-size:23px;margin:0;letter-spacing:-.035em}
.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.sp{flex:1}
.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.card.hov{cursor:pointer}
.card.hov:hover,.card.lift:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.08)}
.card .ph{aspect-ratio:16/9;background:#e9e8e3 center/cover;position:relative}
.card .ph .ph-area{position:absolute;left:10px;bottom:10px;background:rgba(18,18,18,.78);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.lf-bar{display:flex;gap:8px;align-items:center;margin:-8px 0 16px;flex-wrap:wrap}.lf-bar #lf-q{max-width:220px}.lf-bar select.in{width:auto}.lf-num{width:136px}.lf-num .in{padding-right:40px}
.lsec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}.lsec h2{font-size:17px;margin:0;letter-spacing:-.01em}
.lm-i{align-items:flex-start}.lm-i .pk-n{margin-top:12px}.lm-act{display:flex;gap:6px;margin-top:4px}.lm .pk-map .cd{cursor:pointer}.bscroll{overflow-x:auto}.bt-p{padding:4px 18px 8px}.bt{min-width:980px}.bt td{vertical-align:top}.bt tr.bt-first td{border-top:1px solid var(--line)}.bt tbody tr:first-child td{border-top:0}.bt-b small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}.bt-b{max-width:260px}
.lm .pk-map{position:sticky;top:16px}.lm .pk-list{max-height:calc(100vh - 120px)}
.card .ph .tags{position:absolute;left:10px;top:10px;display:flex;gap:5px}
.card .ph .tags .chip{backdrop-filter:blur(8px);background:rgba(255,255,255,.88)}
.card .ph .tags .chip.red{background:rgba(251,233,232,.95)}
.card .ph .tags .chip.warn{background:rgba(253,243,220,.95)}
.card .ph .tags .chip.dark{background:rgba(18,18,18,.85)}
.card .bd{padding:14px 16px 12px}
.card .t{font-weight:700;font-size:15.5px;letter-spacing:-.03em}
.card .ad{color:var(--muted);font-size:12.5px;margin-top:2px}
.kv{display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.kv b{display:block;color:var(--ink);font-weight:600;font-size:13.5px;margin-top:1px}
.ft{display:flex;align-items:center;gap:4px;padding:8px 10px;border-top:1px solid var(--line2)}
.card.dim{opacity:.55}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.panel h3{margin:0 0 16px;font-size:14.5px;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.panel.internal{background:#fffaf0;border-color:#f0dfb6}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label{font-size:12px;color:var(--muted);font-weight:600}
.in{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:64px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ui{position:relative}.ui span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12.5px;pointer-events:none}
.ui .in{padding-right:46px}
.price-row{display:grid;grid-template-columns:90px auto 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line2)}
.price-row:last-child{border-bottom:0}
.price-row>b{font-size:13px;font-weight:600}
.sticky-foot{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:14px 0;background:linear-gradient(transparent,var(--bg) 30%)}

.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:110px;aspect-ratio:4/3;border-radius:10px;background:#eee center/cover;position:relative;border:1px solid var(--line);overflow:hidden;animation:pop .3s var(--ease)}
.thumb.plan{background-color:#fff;background-size:contain;background-repeat:no-repeat}
.thumb button{position:absolute;right:4px;top:4px;border:0;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;line-height:20px;padding:0;opacity:0;transition:opacity .2s}
.thumb:hover button{opacity:1}
.thumb em{position:absolute;left:6px;bottom:5px;font-style:normal;font-size:11px;background:rgba(255,255,255,.9);padding:1px 6px;border-radius:6px}
.add-tile{width:110px;aspect-ratio:4/3;border-radius:10px;border:1.5px dashed #cfccc3;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s;font-size:12.5px;position:relative}
.add-tile:hover{border-color:var(--accent);color:var(--accent)}
.add-tile input{position:absolute;inset:0;opacity:0;cursor:pointer}

.fl-row{display:grid;grid-template-columns:54px auto 170px auto 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.fl-row:last-child{border-bottom:0}
.fl-row .fn{font-weight:700;font-variant-numeric:tabular-nums}

.search-res{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;animation:pop .2s var(--ease)}
.search-res button{display:flex;width:100%;border:0;background:#fff;padding:10px 14px;text-align:left;gap:10px;align-items:center;border-bottom:1px solid var(--line2);transition:background .15s}
.search-res button:hover{background:#f7f7f4}
.bcard{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;background:#f7f7f4;margin-top:10px;animation:pop .3s var(--ease)}
.bcard .kv{margin-top:4px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.ended td{color:var(--muted)}
.tbl tr.ended td.tn{text-decoration:line-through}

/* modal */
#modal-root .back{position:fixed;inset:0;background:rgba(18,18,18,.38);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:30px;animation:fadeIn .2s ease}
.modal{background:#fff;border-radius:18px;width:min(640px,100%);max-height:calc(100vh - 60px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .32s var(--ease)}
.modal.wide{width:min(1120px,100%)}
.modal.full{width:min(1200px,100%);height:calc(100vh - 60px);background:var(--bg)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:inherit;z-index:2}
.mh b{font-size:15.5px}
.mb{padding:18px 20px}
.pick{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;transition:background .15s}
.pick:hover{background:#f7f7f4}
.pick .pi{width:64px;height:44px;border-radius:8px;background:#eee center/cover;flex:none}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:slideIn .35s var(--ease);max-width:360px;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(8px)}
.toast small{display:block;color:#b9b7b0;margin-top:2px}

/* guide */
.guide{position:fixed;right:16px;top:66px;width:300px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.14);z-index:40;padding:16px 18px;animation:pop .3s var(--ease);max-height:calc(100vh - 90px);overflow:auto}
.guide h4{margin:12px 0 6px;font-size:12px;color:var(--muted)}
.guide h4:first-child{margin-top:0}
.guide ol{margin:0;padding-left:18px;font-size:13px;line-height:1.75}

/* notifications / log */
.list .li{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line2)}
.list .li .d{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;animation:pulse 1.8s infinite}
.list .li .d.read{background:#d6d4cd;animation:none}
.list .li time{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat span{color:var(--muted);font-size:12px;font-weight:600}
.stat b{display:block;font-size:28px;letter-spacing:-.04em;margin-top:4px;font-variant-numeric:tabular-nums}
.conf{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid #f0dfb6;background:#fffaf0;border-radius:12px;margin-bottom:8px}

/* poly editor */
.stage{position:relative;cursor:crosshair;user-select:none;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage img{width:100%}
.stage svg,.planv svg{position:absolute;inset:0;width:100%;height:100%}
.stage .pt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);animation:pop .2s var(--ease)}
.stage .pt.first{background:var(--accent)}
.poly{fill:rgba(42,120,214,.24);stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.poly.all{fill:rgba(42,120,214,.13);stroke-dasharray:6 4}

/* ---------- listing form / card extras ---------- */
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.kv2 div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv2 span{font-size:11.5px;color:var(--muted)}
.kv2 b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-row{grid-template-columns:54px 112px 130px 170px auto 1fr!important}
.fl-head{font-size:11.5px;color:var(--muted);font-weight:600;padding:0 0 6px!important}
.totals{display:flex;gap:28px;justify-content:flex-end;padding-top:14px;margin-top:6px;border-top:1px solid var(--line)}
.totals div{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.totals span{font-size:11.5px;color:var(--muted)}
.totals b{font-size:18px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pick-kv{display:flex;gap:14px;margin-top:4px;font-size:12px;color:var(--muted)}.pick-kv b{color:var(--ink);font-weight:600;margin-left:3px}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px}

/* ---------- history timeline ---------- */
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 16px;animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
.tl-d{position:absolute;left:-18px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--accent)}
.tl-b{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:10px 14px}
.tl-b time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.av{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.tl-c{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.ch{display:grid;grid-template-columns:120px max-content 18px 1fr;gap:8px;align-items:baseline;font-size:13px;padding:6px 8px;background:#f7f7f4;border-radius:8px}
.ch-k{color:var(--muted);font-size:12px}.ch-k i{font-style:normal;font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:0 5px;margin-left:5px}
.ch-f{color:var(--muted);text-decoration:line-through}.ch-a{color:var(--muted)}.ch-t{font-weight:600}

/* ---------- data widgets (drawn inside slides) ---------- */
.insight{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:14px}
.insight b{color:var(--accent-2)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tiles.t2{grid-template-columns:1fr 1fr}
.tile{background:#fcfcfa;border:1px solid var(--line2);border-radius:12px;padding:12px 14px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:20px;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart{background:#fcfcfa;border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
.chart h5{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.cols .bar{width:100%;max-width:34px;background:#bcd3ef;border-radius:4px 4px 0 0;height:var(--h)}
.cols .c.peak .bar{background:var(--accent)}
.cols .v{font-size:11px;font-weight:700;min-height:14px;font-variant-numeric:tabular-nums}
.cols .k{font-size:10.5px;color:var(--muted);white-space:nowrap}
.hb{display:flex;flex-direction:column;gap:7px}
.hb .r{display:grid;grid-template-columns:78px 1fr 74px;gap:8px;align-items:center;font-size:12px}
.hb .r span:first-child{color:var(--ink2)}
.hb .tr{height:12px;background:#f1f0ec;border-radius:3px;overflow:hidden}
.hb .b{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:0 4px 4px 0}
.hb .r span:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.line path.l{fill:none;stroke:var(--accent);stroke-width:2}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin:6px 0 8px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.xs-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.xs-h h4{margin:0;font-size:17px;letter-spacing:-.02em}
.xb{display:flex;flex-direction:column;gap:5px;min-width:110px}
.xb b{font-size:13.5px;font-variant-numeric:tabular-nums}

/* ---------- proposal editor ---------- */
.ed-grid{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.mods{display:flex;flex-direction:column;gap:6px}
.mod{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .2s}
.mod:hover{background:#f7f7f4}
.mod div{flex:1;min-width:0}.mod b{display:block;font-size:13px;font-weight:600}.mod span{font-size:11px;color:var(--muted)}
.mod input{display:none}
.sw{width:34px;height:20px;border-radius:999px;background:#d6d4cd;position:relative;flex:none;transition:background .25s}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.mod.on .sw{background:var(--accent)}.mod.on .sw::after{transform:translateX(14px)}
.pcv{display:grid;grid-template-columns:280px 1fr;gap:18px}
.gcv{display:flex;flex-direction:column;gap:9px}
.gcv .slw{border-radius:8px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ctl>span{font-size:12px;color:var(--muted);font-weight:600;width:38px;flex:none}
.ctl select.in{flex:1;min-width:0;padding:5px 8px;font-size:12.5px}
.sws{display:flex;align-items:center;gap:6px}
.sws button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sws button.on{box-shadow:0 0 0 2px var(--accent)}
.sws input{width:28px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.pos9{display:grid;grid-template-columns:repeat(3,26px);gap:3px}
.pos9 button{height:15px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0}
.pos9 button.on{background:var(--accent);border-color:var(--accent)}
.grp{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2);background:#fbfbf9}
.grp-h .gi{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.grp-h .in{font-weight:700;max-width:240px;padding:6px 10px}
.grp-b{padding:16px;display:grid;grid-template-columns:280px 1fr;gap:18px}
.gitem{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.gitem:first-child{padding-top:0}
.gitem.off{opacity:.55}
.gitem .ph{width:88px;aspect-ratio:4/3;border-radius:8px;background:#eee center/cover;flex:none;align-self:flex-start}
.gi-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.gi-b textarea.in{min-height:58px;font-size:13px}
.ph-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ph-ctl>span:first-child{font-size:12px;color:var(--muted);font-weight:600;width:62px;flex:none}
.ph-pick{display:flex;gap:5px;flex-wrap:wrap}
.ph-pick button{width:46px;height:34px;border-radius:6px;border:2px solid transparent;background:#eee center/cover;padding:0;opacity:.7}
.ph-pick button.on{border-color:var(--accent);opacity:1}
.in.mini{width:auto;padding:3px 6px;font-size:12px;border-radius:7px}
.fxbox{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:12px;padding:10px 12px;border-radius:10px;background:#f7f7f4;font-size:12.5px}.fxbox span{color:var(--muted)}
.pv-wrap{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}
.outl{position:sticky;top:76px;display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 96px);overflow:auto}
.outl.in-panel{position:static;max-height:none}
.outl button{border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:8px;font-size:12.5px;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.outl button:hover{background:#efeee9}
.outl button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outl b{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;flex:none}
.outl .og{font-weight:700;color:var(--ink);margin-top:6px}
.deck{display:flex;flex-direction:column;gap:22px;min-width:0}
.deck-i{display:flex;flex-direction:column;gap:7px;scroll-margin-top:80px}
.deck-l{display:flex;gap:8px;font-size:12px;color:var(--muted)}.deck-l b{color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- responsive: tablet ---------- */
@media (max-width:900px){
  .top{position:relative;flex-wrap:wrap;gap:10px;padding:10px 14px}
  .top .seg{order:3;flex-basis:100%;overflow-x:auto;scrollbar-width:none}
  .top .seg button{flex:none}
  .tools{margin-left:auto}
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .side .me{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .main{padding:20px 16px 80px}
  .ed-grid,.grp-b,.pcv,.pv-wrap,.med,.pk{grid-template-columns:1fr}
  .lm .pk-map{position:relative;top:auto}.lm .pk-list{max-height:none}
  .cover-p{flex-direction:column;align-items:stretch}.cp-th{width:100%}
  .wz-steps{margin-left:0;flex-basis:100%}
  .outl:not(.in-panel){display:none}
  .stats{grid-template-columns:repeat(2,1fr)}

}

/* ---------- responsive: mobile ---------- */
@media (max-width:600px){
  body{font-size:13.5px}
  .logo{font-size:16px}
  .tools .today{font-size:12.5px;padding:0 4px}
  .tools .btn.sm{padding:5px 7px}
  h1{font-size:20px}
  .head{flex-wrap:wrap}
  .grid{grid-template-columns:1fr}
  .ft{flex-wrap:wrap}
  .panel{padding:16px;overflow-x:auto}
  .panel .tbl{min-width:560px}
  .fg{grid-template-columns:1fr 1fr}
  .price-row{grid-template-columns:1fr;gap:8px}
  .fl-head{display:none!important}
  .fl-row{display:flex!important;flex-wrap:wrap;gap:8px}
  .fl-row .fn{width:36px}.fl-row .ui{width:120px}.fl-row select{flex:1 1 140px}
  .totals{justify-content:space-between}
  .sticky-foot{padding:12px 0}
  .stats{gap:10px}.stat b{font-size:22px}
  .grp-h{flex-wrap:wrap}.grp-h .in{max-width:none;flex:1}
  .gitem{flex-direction:column}.gitem .ph{width:100%;aspect-ratio:16/9}
  .deck{gap:14px}.slw{border-radius:6px}
  #modal-root .back{padding:0;align-items:flex-end}
  .modal{width:100%;max-height:92vh;border-radius:18px 18px 0 0}
  .modal.wide{height:auto;border-radius:18px 18px 0 0}
  .mh{padding:12px 14px;flex-wrap:wrap}
  .mb{padding:14px}
  .ch{grid-template-columns:1fr;gap:2px}.ch-a{display:none}
  #toasts{left:12px;right:12px}.toast{max-width:none}
}
@media (hover:none){.thumb button{opacity:1}}

/* ---------- print: one slide per page ---------- */
#print-root{display:none}
@media print{
  @page{size:1280px 720px;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing{background:#fff}
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  #print-root .slw{width:1280px;height:720px;aspect-ratio:auto;border-radius:0;box-shadow:none;break-after:page;--k:1}
}

</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="print-root"></div>
<script src="map-data.js"></script>
<script src="official-data.js"></script>
<script>
/* =========================================================
   LeaseDesk prototype — single file, in-memory + localStorage
   ========================================================= */
const KEY = 'leasedesk-proto-v13';
// Prototype data must remain usable regardless of the demo calendar date.
const AUTO_EXPIRY_ENABLED = false;
const store = (() => { try { const t = '__t'; localStorage.setItem(t, t); localStorage.removeItem(t); return localStorage; } catch (e) { const m = {}; return {getItem: k => m[k] ?? null, setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; }, clear: () => {}}; } })();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const nf = (v, d = 0) => Number(v).toLocaleString('ko-KR', {maximumFractionDigits: d});
const clone = o => JSON.parse(JSON.stringify(o));
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((new Date(a + 'T00:00:00Z') - new Date(b + 'T00:00:00Z')) / 864e5);
const fmtDate = d => d ? d.replace(/-/g, '.') : '';
const fmtStamp = s => s ? s.slice(5, 10).replace('-', '.') + ' ' + s.slice(11, 16) : '';
const DOW = ['일','월','화','수','목','금','토'];
const stamp = () => S.today + 'T' + new Date().toTimeString().slice(0, 8);

/* ---------- media ---------- */
const IMG = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=1400&q=70`;
const PH = {
  seoulStreet: IMG('1517154421773-0529f29ea451'), seoulNeon: IMG('1538485399081-7191377e8241'), cheonggye: IMG('1601621915196-2621bfb0cd6e'),
  arcade: IMG('1481437156560-3205f6a55735'), openSign: IMG('1472851294608-062f824d29cc'),
  apparel: IMG('1441984904996-e0b6ba687e04'), apparel2: IMG('1555529771-835f59fc5efe'), apparel3: IMG('1567401893414-76b7b1e5a7a5'),
  cafeBar: IMG('1554118811-1e0d58224f24'), cafeSign: IMG('1501339847302-ac426a4a7cbb'), terrace: IMG('1559925393-8be0ec4767c8'), garden: IMG('1600093463592-8e36ae95ef56'),
  shopFront: IMG('1528698827591-e19ccd7bc23d'), shopIn: IMG('1441986300917-64674bd600d8'), cafe: IMG('1555396273-367ea4eb4db5'),
  shopLoft: IMG('1600508774634-4e11d34730e2'), brick: IMG('1538688525198-9b88f6f53126'), mall: IMG('1519567241046-7f570eee3ce6'),
  site: IMG('1541888946425-d81bb19240f5'), towerA: IMG('1486406146926-c627a92ad1ab'),
};
const SAMPLE_PHOTOS = [PH.shopFront, PH.shopLoft, PH.cafeBar, PH.apparel, PH.terrace, PH.brick, PH.site, PH.garden];

function svgURL(s) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }

/* realistic office core-type floor plan */
function officePlan(title, sub) {
  const X0 = 70, Y0 = 84, W = 860, H = 440, nx = 8, ny = 4, bx = W / nx, by = H / ny;
  const k = '#1b1b1b', g = '#8d8d8d';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica,Arial,sans-serif">
  <defs><pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9c9c9c" stroke-width=".8"/></pattern></defs>
  <rect width="1000" height="640" fill="#fff"/>`;
  for (let i = 0; i <= nx; i++) { const x = X0 + i * bx;
    s += `<line x1="${x}" y1="${Y0 - 36}" x2="${x}" y2="${Y0 + H + 16}" stroke="#cfcfcf" stroke-width=".6" stroke-dasharray="8 3 1.5 3"/><circle cx="${x}" cy="${Y0 - 46}" r="9" fill="#fff" stroke="${g}" stroke-width=".8"/><text x="${x}" y="${Y0 - 42.6}" font-size="8.5" text-anchor="middle" fill="#555">X${i + 1}</text>`; }
  for (let j = 0; j <= ny; j++) { const y = Y0 + j * by;
    s += `<line x1="${X0 - 36}" y1="${y}" x2="${X0 + W + 16}" y2="${y}" stroke="#cfcfcf" stroke-width=".6" stroke-dasharray="8 3 1.5 3"/><circle cx="${X0 - 46}" cy="${y}" r="9" fill="#fff" stroke="${g}" stroke-width=".8"/><text x="${X0 - 46}" y="${y + 3}" font-size="8.5" text-anchor="middle" fill="#555">Y${j + 1}</text>`; }
  // dimensions
  const dy = Y0 - 20;
  s += `<line x1="${X0}" y1="${dy}" x2="${X0 + W}" y2="${dy}" stroke="#777" stroke-width=".6"/>`;
  for (let i = 0; i <= nx; i++) { const x = X0 + i * bx; s += `<line x1="${x - 3}" y1="${dy + 3}" x2="${x + 3}" y2="${dy - 3}" stroke="#444" stroke-width="1"/>`; if (i < nx) s += `<text x="${x + bx / 2}" y="${dy - 4}" font-size="8" text-anchor="middle" fill="#666">8,400</text>`; }
  const dx = X0 + W + 30;
  s += `<line x1="${dx}" y1="${Y0}" x2="${dx}" y2="${Y0 + H}" stroke="#777" stroke-width=".6"/>`;
  for (let j = 0; j <= ny; j++) { const y = Y0 + j * by; s += `<line x1="${dx - 3}" y1="${y + 3}" x2="${dx + 3}" y2="${y - 3}" stroke="#444"/>`; if (j < ny) s += `<text x="${dx + 6}" y="${y + by / 2 + 3}" font-size="8" fill="#666">8,100</text>`; }
  // curtain wall
  s += `<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" fill="none" stroke="${k}" stroke-width="4.5"/><rect x="${X0 + 5}" y="${Y0 + 5}" width="${W - 10}" height="${H - 10}" fill="none" stroke="#999" stroke-width=".6"/>`;
  for (let x = X0; x <= X0 + W + .1; x += bx / 4) s += `<line x1="${x}" y1="${Y0 - 2}" x2="${x}" y2="${Y0 + 6}" stroke="${k}" stroke-width="1.2"/><line x1="${x}" y1="${Y0 + H - 6}" x2="${x}" y2="${Y0 + H + 2}" stroke="${k}" stroke-width="1.2"/>`;
  for (let y = Y0; y <= Y0 + H + .1; y += by / 3) s += `<line x1="${X0 - 2}" y1="${y}" x2="${X0 + 6}" y2="${y}" stroke="${k}" stroke-width="1.2"/><line x1="${X0 + W - 6}" y1="${y}" x2="${X0 + W + 2}" y2="${y}" stroke="${k}" stroke-width="1.2"/>`;
  // core
  const cx = X0 + 3 * bx, cy = Y0 + by, cw = 2 * bx, ch = 2 * by;
  s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="#f3f3f1" stroke="${k}" stroke-width="3.2"/>`;
  const stair = (x, y, w, h) => { let t = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="${k}" stroke-width="1.6"/><line x1="${x + w / 2}" y1="${y + 8}" x2="${x + w / 2}" y2="${y + h - 8}" stroke="${k}" stroke-width="1"/>`;
    for (let yy = y + 14; yy < y + h - 10; yy += 7) t += `<line x1="${x + 3}" y1="${yy}" x2="${x + w - 3}" y2="${yy}" stroke="#666" stroke-width=".6"/>`;
    return t + `<path d="M${x + w / 4} ${y + h - 14} V${y + 18} l-3 6 m3 -6 l3 6" fill="none" stroke="${k}" stroke-width=".8"/><text x="${x + w / 2}" y="${y + h + 11}" font-size="7.5" text-anchor="middle" fill="#555">계단실</text>`; };
  s += stair(cx + 6, cy + 6, 50, 98) + stair(cx + cw - 56, cy + ch - 112, 50, 98);
  for (let i = 0; i < 3; i++) { const ex = cx + 66 + i * 38, ey = cy + 8;
    s += `<rect x="${ex}" y="${ey}" width="34" height="34" fill="#fff" stroke="${k}" stroke-width="1.3"/><line x1="${ex}" y1="${ey}" x2="${ex + 34}" y2="${ey + 34}" stroke="#777" stroke-width=".6"/><line x1="${ex + 34}" y1="${ey}" x2="${ex}" y2="${ey + 34}" stroke="#777" stroke-width=".6"/><line x1="${ex + 8}" y1="${ey + 36}" x2="${ex + 26}" y2="${ey + 36}" stroke="${k}" stroke-width="2"/>`; }
  s += `<text x="${cx + 123}" y="${cy + 64}" font-size="8" text-anchor="middle" fill="#555">E/V 홀</text>`;
  // toilets
  const tx = cx + 6, ty = cy + ch - 104;
  s += `<rect x="${tx}" y="${ty}" width="74" height="46" fill="#fff" stroke="${k}" stroke-width="1.3"/><rect x="${tx}" y="${ty + 52}" width="74" height="46" fill="#fff" stroke="${k}" stroke-width="1.3"/>`;
  for (let i = 0; i < 4; i++) { s += `<rect x="${tx + 4 + i * 17}" y="${ty + 3}" width="14" height="16" fill="none" stroke="#777" stroke-width=".6"/><ellipse cx="${tx + 11 + i * 17}" cy="${ty + 10}" rx="3.5" ry="4.5" fill="none" stroke="#777" stroke-width=".6"/>`;
    s += `<rect x="${tx + 4 + i * 17}" y="${ty + 79}" width="14" height="16" fill="none" stroke="#777" stroke-width=".6"/><ellipse cx="${tx + 11 + i * 17}" cy="${ty + 88}" rx="3.5" ry="4.5" fill="none" stroke="#777" stroke-width=".6"/>`; }
  s += `<text x="${tx + 37}" y="${ty + 35}" font-size="7.5" text-anchor="middle" fill="#555">남자화장실</text><text x="${tx + 37}" y="${ty + 72}" font-size="7.5" text-anchor="middle" fill="#555">여자화장실</text>`;
  s += `<path d="M${tx + 74} ${ty + 30} a14 14 0 0 1 14 14" fill="none" stroke="#777" stroke-width=".6"/><path d="M${tx + 74} ${ty + 82} a14 14 0 0 0 14 -14" fill="none" stroke="#777" stroke-width=".6"/>`;
  // shafts
  [['EPS', cx + 96, cy + ch - 46], ['TPS', cx + 126, cy + ch - 46], ['PS', cx + 96, cy + ch - 76], ['AD', cx + 126, cy + ch - 76]].forEach(([l, x, y]) => {
    s += `<rect x="${x}" y="${y}" width="26" height="24" fill="url(#h)" stroke="${k}" stroke-width="1"/><text x="${x + 13}" y="${y + 15}" font-size="7" text-anchor="middle" fill="#333" font-weight="700">${l}</text>`; });
  s += `<rect x="${cx + 6}" y="${cy + 112}" width="54" height="30" fill="#fff" stroke="${k}" stroke-width="1"/><text x="${cx + 33}" y="${cy + 130}" font-size="7.5" text-anchor="middle" fill="#555">탕비실</text>`;
  // columns
  for (let i = 0; i <= nx; i++) for (let j = 0; j <= ny; j++) s += `<rect x="${X0 + i * bx - 7}" y="${Y0 + j * by - 7}" width="14" height="14" fill="${k}"/>`;
  // labels
  s += `<text x="${X0 + 1.5 * bx}" y="${Y0 + H / 2 + 4}" font-size="12" text-anchor="middle" fill="#a3a3a3" letter-spacing="3">OFFICE</text><text x="${X0 + 6.5 * bx}" y="${Y0 + H / 2 + 4}" font-size="12" text-anchor="middle" fill="#a3a3a3" letter-spacing="3">OFFICE</text>`;
  // north + scale + title
  s += `<g transform="translate(952,48)"><circle r="14" fill="none" stroke="#555" stroke-width=".8"/><path d="M0 -12 L5 6 L0 2 L-5 6Z" fill="${k}"/><text y="-17" font-size="8" text-anchor="middle" font-weight="700">N</text></g>`;
  s += `<g transform="translate(${X0},585)"><rect width="40" height="5" fill="${k}"/><rect x="40" width="40" height="5" fill="#fff" stroke="${k}" stroke-width=".8"/><rect x="80" width="80" height="5" fill="${k}"/><text y="17" font-size="8" fill="#555">0</text><text x="40" y="17" font-size="8" fill="#555" text-anchor="middle">5</text><text x="80" y="17" font-size="8" fill="#555" text-anchor="middle">10</text><text x="160" y="17" font-size="8" fill="#555" text-anchor="middle">20m</text></g>`;
  s += `<g transform="translate(700,566)"><rect width="230" height="46" fill="#fff" stroke="${k}" stroke-width="1"/><line x1="0" y1="26" x2="230" y2="26" stroke="${k}" stroke-width=".6"/><text x="10" y="18" font-size="11" font-weight="700">${esc(title)}</text><text x="10" y="39" font-size="8.5" fill="#555">${esc(sub)}</text><text x="220" y="39" font-size="8.5" fill="#555" text-anchor="end">S=1/400</text></g>`;
  return svgURL(s + '</svg>');
}

/* realistic street-front retail plan */
function retailPlan(title, sub, street, upper) {
  const X0 = 140, Y0 = 70, W = 720, H = 380, k = '#1b1b1b';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica,Arial,sans-serif">
  <defs><pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9c9c9c" stroke-width=".8"/></pattern></defs>
  <rect width="1000" height="640" fill="#fff"/>`;
  // party walls (hatched) + rear wall
  s += `<rect x="${X0 - 14}" y="${Y0 - 14}" width="${W + 28}" height="14" fill="url(#h)" stroke="${k}" stroke-width="1.2"/>`;
  s += `<rect x="${X0 - 14}" y="${Y0}" width="14" height="${H}" fill="url(#h)" stroke="${k}" stroke-width="1.2"/><rect x="${X0 + W}" y="${Y0}" width="14" height="${H}" fill="url(#h)" stroke="${k}" stroke-width="1.2"/>`;
  const gy = Y0 + H, ex = X0 + W / 2 - 40;
  if (upper) {

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW_EN = {'일': 'Sun', '월': 'Mon', '화': 'Tue', '수': 'Wed', '목': 'Thu', '금': 'Fri', '토': 'Sat'};
let EN_RE = null;
Object.keys(EN).filter(k => k.includes('&')).forEach(k => { EN[k.replace(/&/g, '&amp;')] = EN[k]; });
const wonEN = v => v >= 1e9 ? `₩${(v / 1e9).toFixed(2).replace(/\.?0+$/, '')}B` : v >= 1e6 ? `₩${(v / 1e6).toFixed(1).replace(/\.0$/, '')}M` : `₩${nf(Math.round(v))}`;
const num = a => parseFloat(String(a).replace(/,/g, ''));
const tv = s => U.lang === 'en' ? (EN[s] ?? s) : s;
function tr(h) {
  if (U.lang !== 'en') return h;
  if (!EN_RE) EN_RE = new RegExp(Object.keys(EN).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
  h = h.replace(/>([월화수목금토일])</g, (_, d) => `>${DOW_EN[d]}<`).replace(/="([월화수목금토일]) ·/g, (_, d) => `="${DOW_EN[d]} ·`).replace(/(\d+(?:\.\d+)?)천 명/g, '$1k');
  h = h.replace(EN_RE, m => EN[m]).replace(/>층</g, '>Floor<')
    .replace(/(\d[\d,]*(?:\.\d+)?)억\s?(\d[\d,]*(?:\.\d+)?)만원/g, (_, a, b) => wonEN(num(a) * 1e8 + num(b) * 1e4))
    .replace(/(\d[\d,]*(?:\.\d+)?)억원?/g, (_, a) => wonEN(num(a) * 1e8))
    .replace(/(\d[\d,]*(?:\.\d+)?)만원/g, (_, a) => wonEN(num(a) * 1e4))
    .replace(/(\d[\d,]*)원/g, (_, a) => wonEN(num(a)))
    .replace(/평당 /g, 'per py ').replace(/(\d[\d,]*(?:\.\d+)?)평/g, '$1 py')
    .replace(/(\d{4})년 (\d)분기/g, 'Q$2 $1').replace(/(\d{4})년 (\d{1,2})월/g, (_, y, m) => `${MON[+m - 1]} ${y}`)
    .replace(/(\d{4})년/g, '$1').replace(/(\d+(?:\.\d+)?)년/g, '$1 yrs')
    .replace(/(\d+)개월/g, '$1 mo').replace(/(\d+)개 층/g, '$1 floors')
    .replace(/(\d[\d,]*)곳/g, '$1').replace(/(\d[\d,]*)명/g, '$1').replace(/(\d[\d,]*)세대/g, '$1 HH').replace(/(\d+)회/g, '$1×')
    .replace(/(\d+)분 (\d+)초/g, '$1m $2s').replace(/(\d+)분/g, '$1m').replace(/(\d+)초/g, '$1s')
    .replace(/(\d+)층/g, '$1').replace(/(\d+)시/g, '$1h').replace(/(\d)0대/g, '$10s').replace(/(\d{1,2})월/g, (_, m) => MON[+m - 1]);
  return h;
}

function advance(n) {
  for (let i = 0; i < n; i++) {
    const prev = S.today; S.today = addDays(S.today, 1);
    for (const L of S.listings) {
      if (L.status !== 'active') continue;
      const left = diffDays(L.mEnd, S.today), t = bInfo(L).name;
      if (left === 14) note(L.ownerId, `<b>${esc(t)}</b> 용역 만료 D-14`);
      if (AUTO_EXPIRY_ENABLED && left < 0) { L.status = 'expired'; logHist(L.id, 'system', '자동 만료', [{label: '상태', from: '진행', to: '만료'}]); note(L.ownerId, `<b>${esc(t)}</b> 용역 만료 → 자동 종료`); }
    }
    for (const B of S.buildings) {
      const r = REGISTRY.find(x => x.pnu === B.pnu);
      if (B.status === '인허가' && r.final && S.today >= r.final.at) {
        const old = B.gfa; Object.assign(B, {status: '준공', gfa: r.final.gfa, year: r.final.year});
        S.listings.filter(L => L.buildingId === B.id).forEach(L => logHist(L.id, 'system', '건축물대장 반영', [{label: '연면적', from: nf(old) + '㎡', to: nf(B.gfa) + '㎡'}]));
        S.listings.filter(L => L.buildingId === B.id).forEach(L => note(L.ownerId, `<b>${esc(B.name)}</b> 건축물대장 등록 · 연면적 ${nf(old)} → ${nf(B.gfa)}㎡`));
      }
    }
    if (S.sync && S.today >= nextSync(S.sync.at)) { syncNow(true); note('admin', `상권 데이터 자동 동기화 · ${S.sync.q} · 공식 상권 ${S.sync.units}곳`); }
    if (S.today.slice(0, 7) !== prev.slice(0, 7)) {
      const m = prevMonth(S.today); S.fx = {month: m, rates: fxFor(m)};
      ['brokerA', 'brokerB', 'admin'].forEach(u => note(u, `참고 환율 갱신 · ${m.replace('-', '년 ')}월 평균 · 기존 제안서는 만들 때 환율 유지`));

  return `<div class="panel bld-p"><div class="row"><h3 style="margin:0">상권 데이터 구성</h3><span class="sub">${esc(S.sync?.q || '')} · 예시 수치</span><div class="sp"></div>${own ? `<span class="sub">반영 비율 ${own}곳 직접 조정</span><button class="btn xs" onclick="getA('${a.id}').wset={};commit()">모두 기본값으로</button>` : ''}</div>
    <p class="bp-lead"><b>${esc(a.name)}</b>의 상권 데이터는 겹치는 서울시 공식 상권 ${us.length}곳의 수치를 <b>각 공식 상권 점포 중 회사 영역 안에 있는 비율</b>만큼 가져와 합친 값입니다.</p>
    <div class="bp-scroll"><table class="tbl bp-t"><thead><tr><th>공식 상권</th><th>유형</th><th class="num">영역 안 점포</th><th class="num">반영 비율</th><th class="num">일평균 유동인구</th><th class="num">→ 반영</th><th class="num">분기 매출</th><th class="num">→ 반영</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${r.u.own ? 'bp-own' : ''}"><td><b>${esc(r.u.o.name)}</b></td><td>${OTYPE[r.u.o.type]}</td><td class="num">${how(r.u)}</td>
        <td class="num bp-wc"><div class="ui bp-w"><input class="in" type="number" min="0" max="100" value="${Math.round(r.u.w * 100)}" onchange="setShare('${a.id}','${r.u.o.code}',this.value)"><span>%</span></div>
          ${r.u.own ? `<button class="bp-def" onclick="setShare('${a.id}','${r.u.o.code}',null)" title="점포 비율로 계산한 기본값">기본값 ${Math.round(r.u.def * 100)}%로</button>` : '<small>기본값</small>'}</td><td class="num">${nf(r.vis)}명</td><td class="num">${nf(r.cv)}명</td><td class="num">${nf(r.sal)}억</td><td class="num">${nf(r.cs)}억</td></tr>`).join('')}
      <tr class="bp-sum"><td colspan="5">${esc(a.name)} 상권 데이터</td><td class="num">${nf(D.pop[2][1])}명</td><td></td><td class="num">${nf(D.sales[D.sales.length - 1][1])}억</td></tr></tbody></table></div>
    <ul class="bp-rules"><li><b>반영 비율</b>: 기본값은 그 공식 상권 점포 중 회사 영역 안에 있는 비율입니다. 숫자를 바꾸면 그 값을 쓰고, "기본값으로"를 누르면 돌아갑니다.</li>
      <li><b>인원 · 매출 · 세대 수</b>: 공식 상권 값 × 반영 비율을 모두 더합니다.</li>
      <li><b>비율 지표</b> (연령 · 시간대 · 주말 매출 비중 · 성별 · 외국인 비중): 반영 비율 × 유동인구로 가중 평균합니다. 예) 주말 매출 비중 ${rows.map(r => `${r.wk}%`).join(' · ')} → <b>${D.week[1]}%</b></li>
      <li><b>가까운 역</b>: 가장 많이 반영된 공식 상권의 역 (${esc(D.subway?.name || '–')})</li></ul></div>`;
}
function rmArea(id) {
  const a = getA(id), used = visProps().filter(p => p.groups.some(g => g.areaId === id || (!g.areaId && groupMaster(g) === a)));
  if (!confirm(`${a.name} 상권 지도를 지울까요?${used.length ? `\n쓰는 제안서 ${used.length}건의 지도 장이 빠집니다.` : ''}`)) return;
  used.forEach(p => p.groups.forEach(g => { if (g.areaId === id || (!g.areaId && groupMaster(g) === a)) g.areaId = 'none'; }));
  S.areas = S.areas.filter(x => x.id !== id); if (S.osm?.[a.osm]) delete S.osm[a.osm];
  U.amap = null; commit(); toast('상권 지도 삭제', a.name);
}
function adminMaps() {
  const a = U.amap && getA(U.amap);
  if (a) return `<div class="head"><button class="btn ghost icon" onclick="U.amap=null;freshMed();render()">←</button><input class="h1-in" value="${esc(a.name)}" size="${Math.max(4, a.name.length + 1)}" title="상권 이름" onchange="getA('${a.id}').name=this.value.trim()||getA('${a.id}').name;commit()"><span class="sub">회사 상권 지도 · 모든 제안서가 같이 씁니다</span><div class="sp"></div><button class="btn sm ghost danger" onclick="rmArea('${a.id}')">상권 지도 삭제</button></div>
    <div class="panel">${mapEditor(medCtx())}</div>
    ${areaBuild(a)}
    <div class="panel cover-p"><div class="cp-th">${thumb(groupCoverSlide({name: a.name, photo: a.photo, style: a.style || {font: 'wide', size: 'L', color: '#ffffff', pos: 'bl'}}))}</div>
      <div><h3>상권 표지 기본값</h3><div class="sub">이 상권으로 새 제안서를 만들 때 상권 표지로 복사됩니다. 제안서에서 바꿀 수 있습니다.</div>
      <div class="row" style="margin-top:10px"><label class="btn sm">사진 업로드<input type="file" accept="image/*" hidden onchange="(f=>f&&readImg(f,src=>{getA('${a.id}').photo=src;commit()}))(this.files[0])"></label><button class="btn sm ghost" onclick="(x=>{x.photo=GROUP_PHOTOS[(GROUP_PHOTOS.indexOf(x.photo)+1)%GROUP_PHOTOS.length];commit()})(getA('${a.id}'))">샘플 바꾸기</button></div></div></div>`;
  return `<div class="head"><h1>상권 지도</h1><span class="sub">회사가 정한 상권 영역 · 제안서 지도 장과 상권 데이터의 기준</span><div class="sp"></div><button class="btn pri" onclick="openModal({type:'newArea'})">+ 새 상권</button></div>
  <div class="panel a sync-p" style="--i:0"><div><b>상권 데이터 전체 동기화</b><span class="sub">서울시 상권분석서비스 공식 상권 ${S.sync?.units || 0}곳(예시) · ${S.sync?.q || '–'} 데이터 · 마지막 ${fmtDate(S.sync?.at || '')} · 다음 예정 ${fmtDate(nextSync(S.sync?.at || S.today))} (분기 종료 2개월 뒤)</span></div><div class="sp"></div><button class="btn sm" onclick="syncNow()">지금 동기화</button></div>
  <div class="grid">${S.areas.map((x, i) => `<div class="card hov a" style="--i:${i}" onclick="U.amap='${x.id}';freshMed();render()"><div class="ph map-th">${mapSvg(x, {view: slideView(null, x)})}</div>
    <div class="bd"><div class="t">${esc(x.name)}</div><div class="ad">${areaLinks(x).length ? esc(linkTxt(x)) : '연결된 공식 상권 없음'}</div>
    <div class="kv"><span>건물<b>${zoneBuildings(x).length - hiddenIn(x)}</b></span><span>표시<b>${(x.marks || []).length}</b></span><span>쓰는 제안서<b>${visProps().filter(p => p.groups.some(g => groupMaster(g) === x)).length}</b></span></div></div></div>`).join('')}</div>`;
}
function adminHand() {
  const ls = S.listings.filter(L => L.status === 'expired' || L.status === 'withdrawn');
  return `<div class="head"><h1>이관</h1><span class="sub">종료된 매물을 다른 브로커가 이어받도록 복사 권한 부여</span></div>
  <div class="grid">${ls.map((L, i) => { const I = bInfo(L);
    return `<div class="card a" style="--i:${i}"><div class="ph" style="background-image:url('${L.photos[0]}')"><div class="tags"><span class="chip ${STATUS[L.status][1]}">${STATUS[L.status][0]}</span><span class="chip">${USERS[L.ownerId].name}</span></div></div>
    <div class="bd"><div class="t">${esc(I.name)}</div><div class="ad">${esc(I.address)} · ${esc(floorLabel(L.floors, L.leaseType))}</div><div class="kv"><span>용역 종료<b>${fmtDate(L.mEnd)}</b></span><span>도면<b>${L.plans.length}</b></span><span>사진<b>${L.photos.length}</b></span></div></div>
    <div class="ft">${Object.keys(USERS).filter(u => u !== 'admin' && u !== L.ownerId).map(u => (L.grants || []).includes(u) ? `<span class="chip ok">✓ ${USERS[u].name} 권한</span>` : `<button class="btn sm" onclick="grant('${L.id}','${u}')">${USERS[u].name}에게 이관</button>`).join('')}</div></div>`; }).join('') || '<div class="empty">종료된 매물 없음</div>'}</div>`;
}
function grant(lid, u) { const L = getL(lid); L.grants = [...(L.grants || []), u]; logHist(lid, 'admin', '이관 권한 부여', [{label: '복사 권한', from: '–', to: USERS[u].name}]); note(u, `<b>${esc(bInfo(L).name)}</b> 이전 매물 복사 권한을 받았습니다`); save(); render(); toast('이관 권한 부여', USERS[u].name); }
/* ---------- modals ---------- */
function openModal(m) { U.modal = m; if (m.type === 'poly') m.pts = clone(D.floors[m.fi].poly || []); renderModal(); }
function closeModal() { const t = U.modal?.type; U.modal = null; renderModal(); if (t === 'pick' || t === 'pickAll' || t === 'gmap') render(); }
function renderModal() {
  const m = U.modal, root = $('#modal-root');
  if (!m) { root.innerHTML = ''; return; }
  let h = '';
  if (m.type === 'poly') {
    const f = D.floors[m.fi], plan = D.plans.find(p => p.id === f.planId);
    const pts = m.pts.map(p => p.join(',')).join(' ');
    h = `<div class="modal wide"><div class="mh"><b>${f.floor}F 임대 영역</b><span class="sub">클릭해서 꼭짓점 추가</span><div class="sp"></div>
      <button class="btn sm ghost" onclick="U.modal.pts.pop();renderModal()" ${m.pts.length ? '' : 'disabled'}>되돌리기</button><button class="btn sm ghost" onclick="U.modal.pts=[];renderModal()">초기화</button><button class="btn sm pri" onclick="savePoly()" ${m.pts.length >= 3 ? '' : 'disabled'}>완료</button></div>
      <div class="mb"><div class="stage" onclick="polyClick(event)"><img src="${plan.src}" draggable="false"><svg viewBox="0 0 1 1" preserveAspectRatio="none">${m.pts.length >= 2 ? `<polygon class="poly" vector-effect="non-scaling-stroke" points="${pts}"/>` : ''}</svg>${m.pts.map((p, i) => `<span class="pt ${i === 0 ? 'first' : ''}" style="left:${p[0] * 100}%;top:${p[1] * 100}%"></span>`).join('')}</div></div></div>`;
  } else if (m.type === 'pick' && groupMaster(getP(m.pid).groups[m.gi]) && window.MAP_DATA) {
    const p = getP(m.pid), g = p.groups[m.gi], a = groupMaster(g);
    h = `<div class="modal map-modal"><div class="mh"><b>${esc(g.name)} · 매물 고르기</b><span class="sub">${esc(a.name)} 영역 안의 진행 중 매물</span><div class="sp"></div><button class="btn sm ghost" onclick="openModal({type:'pickAll',pid:'${p.id}',gi:${m.gi}})">상권 밖 매물</button><button class="btn sm pri" onclick="closeModal();render()">완료</button></div>
      <div class="mb">${pickBody(m)}</div></div>`;
  } else if (m.type === 'pick' || m.type === 'pickAll') {
    const p = getP(m.pid), g = p.groups[m.gi], avail = S.listings.filter(L => live(L, me()) && !p.groups.some(x => x.items.some(it => it.listingId === L.id)));
    h = `<div class="modal"><div class="mh"><b>매물 추가</b><span class="sub">${esc(g.name)}</span><div class="sp"></div><button class="btn sm" onclick="newListing({kind:'prop',pid:'${p.id}',gi:${m.gi},add:true})">+ 새 매물 등록</button><button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="mb">
      ${avail.map(L => `<div class="pick"><div class="pi" style="background-image:url('${L.photos[0]}')"></div><div style="flex:1"><b>${esc(bInfo(L).name)}</b> <span class="sub">${esc(floorLabel(L.floors, L.leaseType))}</span><div class="pick-kv"><span>1층 <b>${area1F(L.floors) != null ? nf(area1F(L.floors)) + '㎡' : '–'}</b></span><span>전체 <b>${nf(L.leaseArea)}㎡</b></span><span>임대료 <b>${priceShort(L.rent)}</b></span>${L.ownerId !== me() ? `<span>담당 <b>${USERS[L.ownerId].name}</b></span>` : ''}</div></div><button class="btn sm" onclick="addItem('${p.id}',${m.gi},'${L.id}');renderModal()">추가</button></div>`).join('') || '<div class="empty">추가할 물건 없음</div>'}</div></div>`;
  } else if (m.type === 'toProp') {
    const ps = visProps().filter(p => p.ownerId === me()), L = getL(m.lid);
    h = `<div class="modal"><div class="mh"><b>${esc(bInfo(L).name)} → 제안서</b><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="mb">
      ${ps.map(p => { const has = p.groups.some(g => g.items.some(x => x.listingId === m.lid));
        return `<div class="pick"><div style="flex:1"><b>${esc(p.clientName)}</b><div class="sub">상권 ${p.groups.length} · 매물 ${p.groups.reduce((s, g) => s + g.items.length, 0)}건</div></div>${has ? `<span class="chip ok">포함됨</span><button class="btn sm" onclick="closeModal();openProp('${p.id}')">열기 →</button>`
          : `<select class="in mini" id="tg-${p.id}">${p.groups.map((g, j) => `<option value="${j}">${esc(g.name)}</option>`).join('')}<option value="new">+ 새 상권</option></select><button class="btn sm" onclick="addItem('${p.id}',(v=>v==='new'?v:+v)($('#tg-${p.id}').value),'${m.lid}');renderModal()">추가</button>`}</div>`; }).join('') || '<div class="empty">제안서가 없습니다</div>'}
      <button class="btn sm" style="margin-top:10px" onclick="startWiz('${m.lid}')">+ 이 매물로 새 제안서</button></div></div>`;
  } else if (m.type === 'detail') {
    const L = getL(m.lid), own = L.ownerId === me(), lang = m.lang || 'ko';
    const sl = withDeck({lang, cur: 'USD', fx: S.fx, ownerId: L.ownerId}, () => listingSlide(L, null, 1, null)).replace('%PG%', '');
    h = `<div class="modal wide"><div class="mh"><b>매물 장표 미리보기</b><span class="sub">제안서에 들어가는 모양</span><div class="sp"></div>
      ${seg([['ko', '한국어'], ['en', 'EN']], lang, "(v=>{U.modal.lang=v;renderModal()})")}
      ${propsWith(L.id).map(p => `<button class="btn sm ghost" onclick="closeModal();openProp('${p.id}')">${esc(p.clientName)} 제안서 →</button>`).join('')}
      ${own ? `<button class="btn sm" onclick="editListing('${L.id}')">수정</button>` : ''}${L.status === 'active' && me() !== 'admin' ? `<button class="btn sm pri" onclick="openModal({type:'toProp',lid:'${L.id}'})">+ 제안서</button>` : ''}<button class="btn sm ghost" onclick="closeModal()">✕</button></div>
      <div class="mb">${thumb(sl)}</div></div>`;
  } else if (m.type === 'gmap' && groupMaster(getP(m.pid).groups[m.gi])) {
    const g = getP(m.pid).groups[m.gi];
    h = `<div class="modal map-modal"><div class="mh"><b>${esc(g.name)} 지도</b><span class="sub">이 제안서에만 적용</span><div class="sp"></div><button class="btn sm pri" onclick="closeModal();render()">완료</button></div><div class="mb">${mapEditor(medCtx())}</div></div>`;
  } else if (m.type === 'newArea') {
    h = `<div class="modal"><div class="mh"><b>새 상권 지도</b><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="mb">
      <div class="f"><label>상권 이름</label><input class="in" id="na-name" value="${esc(m.name || '')}" placeholder="예: 연남동" oninput="U.modal.name=this.value"></div>
      <div class="f" style="margin-top:12px"><label>지도 중심 장소</label><div class="row" style="flex-wrap:nowrap"><input class="in" id="na-q" value="${esc(m.q || '')}" placeholder="주소나 장소 이름 (예: 연남동 경의선숲길)" oninput="U.modal.q=this.value" onkeydown="if(event.key==='Enter')naSearch()"><button class="btn" onclick="naSearch()">찾기</button></div></div>
      <div class="na-res">${(m.results || []).map((r, i) => `<label class="na-i ${m.pick === i ? 'on' : ''}"><input type="radio" name="na" ${m.pick === i ? 'checked' : ''} onchange="U.modal.pick=${i};renderModal()"><span>${esc(r.name)}<small>${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</small></span></label>`).join('') || (m.results ? '<div class="sub">찾은 장소가 없습니다</div>' : '<div class="sub">장소를 찾으면 그 주변 약 1.7 × 0.8 km의 도로 · 건물 데이터를 OpenStreetMap에서 받아 지도를 만듭니다. 다음 단계에서 상권 영역을 그립니다.</div>')}</div>
      ${m.busy ? `<div class="sub" style="margin-top:10px">${m.busy}</div>` : ''}
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" ${m.busy || m.pick == null ? 'disabled' : ''} onclick="naCreate()">지도 만들기</button></div></div></div>`;
  } else if (m.type === 'hist') {
    const L = getL(m.lid), {full, hs} = histFor(m.lid);
    h = `<div class="modal wide"><div class="mh"><b>변경 이력</b><span class="sub">${esc(bInfo(L).name)} · ${esc(floorLabel(L.floors, L.leaseType))}</span><div class="sp"></div>${full ? '' : '<span class="chip">공개 항목만</span>'}<button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="mb">${histList(hs)}</div></div>`;
  } else if (m.type === 'dup') {
    const src = getP(m.pid);
    h = `<div class="modal"><div class="mh"><b>제안서 복제</b><span class="sub">${esc(src.clientName)} · 상권 ${src.groups.length}</span><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
      <form class="mb" onsubmit="event.preventDefault();createDup(this)"><input type="hidden" name="pid" value="${src.id}">
      <div class="f"><label>새 클라이언트명</label><input class="in" name="cname" placeholder="회사명"></div>
      <label class="chk"><input type="checkbox" name="keep" checked> 매물별 코멘트도 복사</label>
      <div class="sub" style="margin-top:8px">상권 구성 · 표지 · 언어 · 통화 · 요청 조건이 그대로 복사됩니다.</div>
      <div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn pri">복제</button></div></form></div>`;
  }
  root.innerHTML = `<div class="back" onclick="if(event.target===this)closeModal()">${h}</div>`;
  fitSlides();
}
function polyClick(e) {
  const r = e.currentTarget.getBoundingClientRect();
  U.modal.pts.push([+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)]);
  renderModal();
}
function savePoly() { D.floors[U.modal.fi].poly = U.modal.pts; U.modal = null; renderModal(); render(); toast('영역 저장'); }

/* ---------- toast ---------- */
function toast(t, s) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `${esc(t)}${s ? `<small>${esc(s)}</small>` : ''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2800);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && U.modal) closeModal(); });

if (!S) S = seed();
if (S.osm && window.MAP_DATA) Object.assign(window.MAP_DATA, S.osm); // trade areas created in this browser
save(); render();
</script>
