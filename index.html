<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeaseDesk · Prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#f5f5f2;--surface:#fff;--ink:#121212;--ink2:#4f4d48;--muted:#8b8881;--line:#e6e4de;--line2:#efeee9;
  --accent:#2a78d6;--accent-2:#1f5fb0;--accent-soft:#e8f1fc;--series-2:#eb6834;
  --warn:#946000;--warn-soft:#fdf3dc;--danger:#c23b3a;--danger-soft:#fbe9e8;--ok:#1d7a52;--ok-soft:#e3f4ec;
  --r:14px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{display:block}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes rise{from{height:0}}
@keyframes draw{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,120,214,.45)}70%{box-shadow:0 0 0 6px rgba(42,120,214,0)}100%{box-shadow:0 0 0 0 rgba(42,120,214,0)}}
.anim .a{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
.anim.view{animation:fadeIn .3s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:10px 20px;background:rgba(245,245,242,.82);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:-.04em;font-size:17px}
.logo i{font-style:normal;color:var(--accent)}
.seg{display:inline-flex;background:#e9e8e3;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--ink2);font-weight:500;transition:background .25s var(--ease),color .2s,box-shadow .25s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.sm button{padding:4px 9px;font-size:12.5px}
.tools{display:flex;align-items:center;gap:4px;margin-left:auto}
.today{font-weight:700;font-variant-numeric:tabular-nums;padding:0 8px}

/* ---------- buttons / chips ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#d2cfc6;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#2b2b2b}
.btn.blue{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:#e9e8e3;box-shadow:none}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--danger)}
.btn.icon{padding:6px 9px}
.btn[disabled]{opacity:.35;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:#efeee9;color:var(--ink2);white-space:nowrap}
.chip.blue{background:var(--accent-soft);color:var(--accent-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.dark{background:var(--ink);color:#fff}
.chip.line{background:#fff;border:1px solid var(--line)}
.ndot{background:var(--danger);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 57px)}
.side{padding:22px 12px;border-right:1px solid var(--line);position:sticky;top:57px;height:calc(100vh - 57px)}
.me{padding:0 12px 16px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.me b{display:block;font-size:15px}.me span{color:var(--muted);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:500;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.nav button:hover{background:#e9e8e3}
.nav button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.main{padding:28px 34px 100px;max-width:1220px;width:100%}
h1{font-size:23px;margin:0;letter-spacing:-.035em}
.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.sp{flex:1}
.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.card.hov{cursor:pointer}
.card.hov:hover,.card.lift:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.08)}
.card .ph{aspect-ratio:16/9;background:#e9e8e3 center/cover;position:relative}
.card .ph .tags{position:absolute;left:10px;top:10px;display:flex;gap:5px}
.card .ph .tags .chip{backdrop-filter:blur(8px);background:rgba(255,255,255,.88)}
.card .ph .tags .chip.red{background:rgba(251,233,232,.95)}
.card .ph .tags .chip.warn{background:rgba(253,243,220,.95)}
.card .ph .tags .chip.dark{background:rgba(18,18,18,.85)}
.card .bd{padding:14px 16px 12px}
.card .t{font-weight:700;font-size:15.5px;letter-spacing:-.03em}
.card .ad{color:var(--muted);font-size:12.5px;margin-top:2px}
.kv{display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.kv b{display:block;color:var(--ink);font-weight:600;font-size:13.5px;margin-top:1px}
.ft{display:flex;align-items:center;gap:4px;padding:8px 10px;border-top:1px solid var(--line2)}
.card.dim{opacity:.55}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.panel h3{margin:0 0 16px;font-size:14.5px;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.panel.internal{background:#fffaf0;border-color:#f0dfb6}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label{font-size:12px;color:var(--muted);font-weight:600}
.in{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:64px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ui{position:relative}.ui span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12.5px;pointer-events:none}
.ui .in{padding-right:46px}
.price-row{display:grid;grid-template-columns:90px auto 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line2)}
.price-row:last-child{border-bottom:0}
.price-row>b{font-size:13px;font-weight:600}
.sticky-foot{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:14px 0;background:linear-gradient(transparent,var(--bg) 30%)}

.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:110px;aspect-ratio:4/3;border-radius:10px;background:#eee center/cover;position:relative;border:1px solid var(--line);overflow:hidden;animation:pop .3s var(--ease)}
.thumb.plan{background-color:#fff;background-size:contain;background-repeat:no-repeat}
.thumb button{position:absolute;right:4px;top:4px;border:0;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;line-height:20px;padding:0;opacity:0;transition:opacity .2s}
.thumb:hover button{opacity:1}
.thumb em{position:absolute;left:6px;bottom:5px;font-style:normal;font-size:11px;background:rgba(255,255,255,.9);padding:1px 6px;border-radius:6px}
.add-tile{width:110px;aspect-ratio:4/3;border-radius:10px;border:1.5px dashed #cfccc3;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s;font-size:12.5px;position:relative}
.add-tile:hover{border-color:var(--accent);color:var(--accent)}
.add-tile input{position:absolute;inset:0;opacity:0;cursor:pointer}

.fl-row{display:grid;grid-template-columns:54px auto 170px auto 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.fl-row:last-child{border-bottom:0}
.fl-row .fn{font-weight:700;font-variant-numeric:tabular-nums}

.search-res{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;animation:pop .2s var(--ease)}
.search-res button{display:flex;width:100%;border:0;background:#fff;padding:10px 14px;text-align:left;gap:10px;align-items:center;border-bottom:1px solid var(--line2);transition:background .15s}
.search-res button:hover{background:#f7f7f4}
.bcard{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;background:#f7f7f4;margin-top:10px;animation:pop .3s var(--ease)}
.bcard .kv{margin-top:4px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.ended td{color:var(--muted)}
.tbl tr.ended td.tn{text-decoration:line-through}

/* modal */
#modal-root .back{position:fixed;inset:0;background:rgba(18,18,18,.38);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:30px;animation:fadeIn .2s ease}
.modal{background:#fff;border-radius:18px;width:min(640px,100%);max-height:calc(100vh - 60px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .32s var(--ease)}
.modal.wide{width:min(1120px,100%)}
.modal.full{width:min(1200px,100%);height:calc(100vh - 60px);background:var(--bg)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:inherit;z-index:2}
.mh b{font-size:15.5px}
.mb{padding:18px 20px}
.pick{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;transition:background .15s}
.pick:hover{background:#f7f7f4}
.pick .pi{width:64px;height:44px;border-radius:8px;background:#eee center/cover;flex:none}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:slideIn .35s var(--ease);max-width:360px;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(8px)}
.toast small{display:block;color:#b9b7b0;margin-top:2px}

/* guide */
.guide{position:fixed;right:16px;top:66px;width:300px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.14);z-index:40;padding:16px 18px;animation:pop .3s var(--ease);max-height:calc(100vh - 90px);overflow:auto}
.guide h4{margin:12px 0 6px;font-size:12px;color:var(--muted)}
.guide h4:first-child{margin-top:0}
.guide ol{margin:0;padding-left:18px;font-size:13px;line-height:1.75}

/* notifications / log */
.list .li{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line2)}
.list .li .d{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;animation:pulse 1.8s infinite}
.list .li .d.read{background:#d6d4cd;animation:none}
.list .li time{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat span{color:var(--muted);font-size:12px;font-weight:600}
.stat b{display:block;font-size:28px;letter-spacing:-.04em;margin-top:4px;font-variant-numeric:tabular-nums}
.conf{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid #f0dfb6;background:#fffaf0;border-radius:12px;margin-bottom:8px}

/* poly editor */
.stage{position:relative;cursor:crosshair;user-select:none;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage img{width:100%}
.stage svg,.planv svg{position:absolute;inset:0;width:100%;height:100%}
.stage .pt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);animation:pop .2s var(--ease)}
.stage .pt.first{background:var(--accent)}
.poly{fill:rgba(42,120,214,.24);stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.poly.all{fill:rgba(42,120,214,.13);stroke-dasharray:6 4}

/* ---------- client page ---------- */
.cp{background:#fbfbf9;min-height:100%}
.cp-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;background:rgba(251,251,249,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.cp-bar{top:57px}.modal .cp-bar{top:53px}
.cp-brand{font-weight:800;letter-spacing:-.03em}
.cp-brand span{color:var(--muted);font-weight:500;margin-left:8px;font-size:12.5px}
.cp-wrap{max-width:1040px;margin:0 auto;padding:40px 28px 80px}
.hero{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;padding-bottom:30px;border-bottom:1px solid var(--line);margin-bottom:34px}
.hero .eyebrow{color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.04em}
.hero h1{font-size:40px;letter-spacing:-.05em;margin:8px 0 14px;line-height:1.1}
.need{display:flex;gap:8px;flex-wrap:wrap}
.need span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.need span em{font-style:normal;color:var(--muted);margin-right:6px}
.bk{text-align:right;font-size:13px;color:var(--ink2);line-height:1.6}
.bk b{font-size:15px;color:var(--ink)}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin:0 0 12px}
.cmp{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;margin-bottom:44px}
.cmp .tbl td{padding:12px}
.cmp tr.go{cursor:pointer;transition:background .15s}
.cmp tr.go:hover{background:#f7f7f4}
.it{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:26px}
.it.ended{background:#f3f3f0;filter:grayscale(1)}
.it-h{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.inum{font-size:13px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:6px}
.it h2{margin:0;font-size:24px;letter-spacing:-.04em}
.gal{display:grid;grid-template-columns:2fr 1fr;grid-auto-rows:160px;gap:8px;border-radius:14px;overflow:hidden;margin-bottom:22px}
.gal div{background:#ddd center/cover;transition:transform .6s var(--ease);position:relative}
.gal .more{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.38);color:#fff;font-weight:700;font-size:20px}
.gal div:first-child{grid-row:span 2}
.gal div:hover{transform:scale(1.02)}
.gal.n1{grid-template-columns:1fr;grid-auto-rows:320px}
.gal.n2{grid-template-columns:1fr 1fr;grid-auto-rows:300px}.gal.n2 div:first-child{grid-row:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.box{border:1px solid var(--line2);border-radius:14px;padding:16px 18px;background:#fcfcfa}
.box h4{margin:0 0 10px;font-size:12px;color:var(--muted);letter-spacing:.03em}
.dl{display:grid;grid-template-columns:96px 1fr;row-gap:9px;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.dl dd .fx{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dl dd .per{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.dl dd .soft{color:var(--ink2);font-weight:500}
.upd{display:inline-block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent-2);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;animation:pulse 2s infinite}
.cm{border-left:3px solid var(--accent);padding:6px 0 6px 14px;margin:0 0 20px;color:var(--ink2);font-size:14px;line-height:1.6}
.cm b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.note{font-size:13px;color:var(--ink2);margin:-4px 0 18px}
.plans{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;margin-bottom:6px}
.planv{flex:0 0 min(560px,88%);scroll-snap-align:start;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:#fff;position:relative}
.planv .pw{position:relative}
.planv .pw img{width:100%}
.planv .cap{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2);font-size:13px}
.planv .cap b{font-variant-numeric:tabular-nums}
.ended-box{display:flex;align-items:center;justify-content:center;height:90px;border-radius:14px;border:1.5px dashed #c9c7bf;color:var(--muted);font-weight:600}
details.area{margin-top:18px;border:1px solid var(--line2);border-radius:14px;background:#fcfcfa}
details.area summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:700}
details.area summary::-webkit-details-marker{display:none}
details.area summary .chev{margin-left:auto;transition:transform .3s var(--ease);color:var(--muted)}
details.area[open] summary .chev{transform:rotate(180deg)}
.area-b{padding:4px 18px 18px;animation:fadeUp .4s var(--ease)}
.insight{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:14px}
.insight b{color:var(--accent-2)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sec .tile,.sec .chart,.sec .insight{background:#fcfcfa}
.tile{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:12px 14px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:20px;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
.chart h5{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.cols .bar{width:100%;max-width:34px;background:#bcd3ef;border-radius:4px 4px 0 0;height:var(--h);animation:rise .8s var(--ease) both;animation-delay:calc(var(--i)*60ms);transition:background .2s}
.cols .c:hover .bar{background:var(--accent)}
.cols .c.peak .bar{background:var(--accent)}
.cols .v{font-size:11px;font-weight:700;min-height:14px;font-variant-numeric:tabular-nums}
.cols .k{font-size:10.5px;color:var(--muted);white-space:nowrap}
.hb{display:flex;flex-direction:column;gap:7px}
.hb .r{display:grid;grid-template-columns:78px 1fr 74px;gap:8px;align-items:center;font-size:12px}
.hb .r span:first-child{color:var(--ink2)}
.hb .tr{height:12px;background:#f1f0ec;border-radius:3px;overflow:hidden}
.hb .b{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:0 4px 4px 0;animation:grow .9s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.hb .r:hover .b{background:var(--accent-2)}
.hb .r span:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.line path.l{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:var(--len);animation:draw 1.2s var(--ease) both}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin:6px 0 8px}
.stack i{display:block;height:100%;animation:grow .9s var(--ease) both}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-0px}
.cp-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.8}
.print-stamp{display:none}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.kv2 div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv2 span{font-size:11.5px;color:var(--muted)}
.kv2 b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-row{grid-template-columns:54px 112px 130px 170px auto 1fr!important}
.fl-head{font-size:11.5px;color:var(--muted);font-weight:600;padding:0 0 6px!important}
.totals{display:flex;gap:28px;justify-content:flex-end;padding-top:14px;margin-top:6px;border-top:1px solid var(--line)}
.totals div{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.totals span{font-size:11.5px;color:var(--muted)}
.totals b{font-size:18px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* proposal tabs */
.cp-bar{flex-wrap:wrap;row-gap:10px}
.ptabs{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.ptab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:5px 12px 5px 5px;white-space:nowrap;font-size:13px;color:var(--ink2);transition:all .25s var(--ease)}
.ptab:hover{border-color:#cfccc3;color:var(--ink)}
.ptab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ptab.ended span:last-child{text-decoration:line-through;opacity:.6}
.pt-ph{width:30px;height:30px;border-radius:8px;background:#ddd center/cover;flex:none}
.pt-cover{width:30px;height:30px;border-radius:8px;background:#efeee9;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:700}
.ptab.on .pt-cover{background:#333;color:#fff}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.pg.in-r{animation:inR .45s var(--ease) both}.pg.in-l{animation:inL .45s var(--ease) both}
.pnav{display:flex;align-items:center;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.pnav span{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
/* cover */
.need{display:grid;grid-template-columns:repeat(3,auto);gap:10px 28px;margin-top:6px}
.need div{display:flex;flex-direction:column;gap:3px}
.need span{font-size:12px;color:var(--muted);background:none;border:0;padding:0}
.need b{font-size:15px;font-weight:600}
.bk{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bk span{font-size:12px;color:var(--muted)}
.bk small{font-size:13px;color:var(--ink2)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:40px}
.pk{border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden;text-align:left;padding:0;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.pk:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
.pk.ended{filter:grayscale(1);opacity:.6}
.pk-ph{aspect-ratio:16/10;background:#ddd center/cover;position:relative}
.pk-ph .pk-n{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);border-radius:8px;padding:2px 8px;font-weight:800;font-size:12px;color:var(--accent)}
.pk-ph .chip{position:absolute;right:10px;top:10px}
.pk-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.pk-b>b{font-size:15px;letter-spacing:-.02em}
.pk-b>small{color:var(--muted);font-size:12px}
.pk-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.pk-kv div{display:flex;flex-direction:column;gap:2px}
.pk-kv span{font-size:11px;color:var(--muted)}
.pk-kv b{font-size:13px;font-weight:600;white-space:nowrap}
/* listing page */
.lp-h .eyebrow{color:var(--accent);font-weight:800;font-size:12.5px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.lp-h h2{font-size:34px;letter-spacing:-.045em;margin:6px 0 4px}
.lp-h .addr{color:var(--ink2);font-size:14px}
.lp .gal{margin:22px 0}
.lp.ended .ended-box{margin-top:24px;height:140px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-size:22px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted);min-height:15px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.specs .sec:last-child{grid-column:1/-1}
.sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.specs .sec{margin-bottom:0}
.specs{margin-bottom:14px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-h h3{margin:0;font-size:15px;letter-spacing:-.02em}
.spec-r{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:start}
.spec-r:last-child{border-bottom:0}
.spec-r .lbl{color:var(--muted);font-size:13px;padding-top:1px}
.val{display:flex;flex-direction:column;gap:2px}
.val b{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.val b.soft{color:var(--ink2);font-weight:500}
.val small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ftbl{width:100%;border-collapse:collapse;font-size:13.5px}
.ftbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:0 0 8px;border-bottom:1px solid var(--line)}
.ftbl td{padding:10px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.ftbl .num{text-align:right}.ftbl .num .val{align-items:flex-end}
.ftbl tr.sum td{border-top:1px solid var(--ink);border-bottom:0;font-weight:700;padding-top:12px}
.lp .note{margin:12px 0 0;font-size:13px;color:var(--ink2);background:#f7f7f4;border-radius:10px;padding:10px 12px}
.lp .cm{margin:0 0 22px;background:var(--accent-soft);border-left:0;border-radius:14px;padding:14px 16px;color:var(--ink)}
.lp .cm b{color:var(--accent-2)}
.charts{grid-template-columns:1fr 1fr}
.pick-kv{display:flex;gap:14px;margin-top:4px;font-size:12px;color:var(--muted)}.pick-kv b{color:var(--ink);font-weight:600;margin-left:3px}
.pbreak{break-before:page;page-break-before:always}

.gate{min-height:calc(100vh - 57px);display:flex;align-items:center;justify-content:center;padding:30px}
.gate .card{width:380px;padding:34px 30px;text-align:center}
.gate .lock{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px}
.pin{display:flex;gap:10px;justify-content:center;margin:20px 0 16px}
.pin input{width:52px;height:60px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid var(--line);border-radius:12px;outline:none;transition:border-color .2s,box-shadow .2s}
.pin input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.shake{animation:shake .4s}
.mail{display:flex;gap:14px;padding:16px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.mail:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.07)}
.mail .av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.mail .url{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent-2);margin-top:6px}

/* ---------- gallery ---------- */
.gal{position:relative}
.gal .gcell{border:0;padding:0;margin:0;overflow:hidden;position:relative;cursor:zoom-in;background:#e9e8e3;border-radius:0}
.gal.n3 .gcell:first-child{grid-row:span 2}
.gal.n2{grid-template-columns:1fr 1fr;grid-auto-rows:300px}
.gal.n1{grid-template-columns:1fr;grid-auto-rows:380px}
.gal .fig{width:100%;height:100%;background:none;transition:transform .7s var(--ease)}
.gal .gcell:hover .fig{transform:scale(1.03)}
.gal.plans{grid-auto-rows:190px}.gal.plans .gcell{background:#fff;border:1px solid var(--line2)}
.gal.plans.n1{grid-auto-rows:420px}
.fig.photo img{width:100%;height:100%;object-fit:cover}
.fig.plan{background:#fff}.fig.plan svg{width:100%;height:100%;display:block}
.gall{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);padding:8px 14px;border-radius:10px;font-weight:600;font-size:12.5px;box-shadow:0 4px 18px rgba(0,0,0,.14);transition:transform .2s var(--ease),box-shadow .2s}
.gall:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.plans-sec .gal{margin:0;border-radius:12px}
.sq{font-style:normal;font-weight:500;color:var(--muted);font-size:.78em;margin-left:2px}
/* viewer */
@keyframes sheetUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes sheetDown{to{opacity:0;transform:translateY(30px)}}
.vw{position:fixed;inset:0;z-index:90;background:#fbfbf9;overflow:auto}
.vw.in{animation:sheetUp .42s var(--ease) both}.vw.out{animation:sheetDown .23s ease forwards}
.vw-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(251,251,249,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.vw-h b{font-size:16px;letter-spacing:-.02em}
.vw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;padding:24px 28px 60px;max-width:1500px;margin:0 auto}
.vw-item{border:0;padding:0;background:#fff;border-radius:14px;overflow:hidden;cursor:zoom-in;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .3s var(--ease),box-shadow .3s}
.vw-item:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.12)}
.vw-item .fig{aspect-ratio:4/3}
.vw-cap{display:block;padding:10px 14px;font-size:12.5px;color:var(--ink2);font-weight:600}
.vw-grid.anim .vw-item{animation:fadeUp .5s var(--ease) both;animation-delay:calc(min(var(--i),12) * 45ms)}
/* lightbox */
@keyframes lbIn{from{opacity:0}to{opacity:1}}
@keyframes figIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes figR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes figL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.lb{position:fixed;inset:0;z-index:95;background:rgba(12,12,12,.93);display:flex;align-items:center;justify-content:center;gap:16px}
.lb.in{animation:lbIn .25s ease both}.lb.out{animation:lbIn .2s ease reverse forwards}
.lb-fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;animation:figIn .35s var(--ease) both}
.lb-fig.fr{animation:figR .35s var(--ease) both}.lb-fig.fl{animation:figL .35s var(--ease) both}
.lb-fig img{max-width:84vw;max-height:84vh;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lb-fig.plan svg{width:min(84vw,calc(84vh * 1.5625));height:auto;background:#fff;border-radius:6px}
.lb-fig figcaption{color:#fff;display:flex;gap:14px;font-size:13px}.lb-fig figcaption span{color:#9a9890}
.lb-nav{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px;line-height:1;transition:background .2s,transform .2s}
.lb-nav:hover{background:rgba(255,255,255,.24);transform:scale(1.06)}.lb-nav[disabled]{opacity:.2;pointer-events:none}
.lb-x{position:absolute;right:22px;top:18px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:16px}
/* currency */
.cur-sel{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff;font-weight:600;font-size:12.5px;cursor:pointer;outline:none}
.cur-sel:focus{border-color:var(--accent)}
.ctbl{width:100%;border-collapse:collapse}
.ctbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:0 0 8px;border-bottom:1px solid var(--line)}
.ctbl th.fxh{display:flex;align-items:center;gap:6px}
.ctbl td{padding:11px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.ctbl tr:last-child td{border-bottom:0}
.ctbl td.lbl{color:var(--muted);font-size:13px;width:96px}
.val.fxv b{color:var(--ink2);font-weight:600}
.cmp .val{align-items:flex-end}
.cmp .val small{font-size:11.5px}
/* stores */
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.store{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:6px;align-items:center;padding:12px;border:1px solid var(--line2);border-radius:12px;background:#fff;animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.store .ico{grid-row:span 2;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-2);display:flex;align-items:center;justify-content:center}
.st-t{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.st-t span{font-size:13px;color:var(--ink2)}.st-t b{font-size:17px;letter-spacing:-.03em}
.st-bar{height:6px;background:#f1f0ec;border-radius:3px;overflow:hidden}.st-bar i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:3px;animation:grow .9s var(--ease) both}
/* map */
.mapwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);isolation:isolate}
.map{height:460px;background:#eceae4}
.osm-tiles{filter:grayscale(.85) contrast(.92) brightness(1.06)}
.leaflet-interactive{transition:fill .7s ease,fill-opacity .7s ease}
.map-time{position:absolute;left:12px;top:12px;z-index:500;display:flex;gap:4px;padding:5px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.map-time button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:background .2s,color .2s}
.map-time button.on{background:var(--ink);color:#fff}
.map-time .play{width:32px;color:var(--accent-2);background:var(--accent-soft)}
.map-leg{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(255,255,255,.94);border-radius:10px;padding:8px 12px;font-size:11.5px;color:var(--ink2);box-shadow:0 4px 18px rgba(0,0,0,.1)}
.ramp{display:flex;margin:5px 0 3px}.ramp i{width:28px;height:8px}
.ramp-l{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px}
.map-note{display:flex;gap:8px;align-items:baseline;padding:12px 2px 0;font-size:13.5px}
.map-note>b{font-size:13px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px}
.pin{position:relative;transform:translate(-50%,-100%)}
.pin-b{width:22px;height:22px;margin:0 auto;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.pin-l{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stn-b{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:#fff;border:1.5px solid #2f8f4e;color:#1d5c33;font-weight:700;font-size:11.5px;padding:3px 8px 3px 3px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.stn-b i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#2f8f4e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px}
/* cover */
.cv-hero{position:relative;height:440px;border-radius:24px;overflow:hidden;margin-bottom:16px;color:#fff}
.cv-mosaic{position:absolute;inset:0;display:grid;gap:3px;grid-template-columns:2fr 1fr 1fr}
.cv-mosaic i{background:#333 center/cover;animation:fadeIn .8s ease both;animation-delay:calc(var(--i)*120ms)}
.cv-mosaic.n4 i:first-child{grid-row:span 2}.cv-mosaic.n4{grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr}.cv-mosaic.n4 i:nth-child(4){grid-column:2/4}
.cv-mosaic.n1{grid-template-columns:1fr}.cv-mosaic.n2{grid-template-columns:1fr 1fr}
.cv-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,16,.35) 0%,rgba(10,12,16,.2) 35%,rgba(10,12,16,.82) 100%)}
.cv-in{position:absolute;inset:0;padding:30px 34px;display:flex;flex-direction:column;justify-content:space-between}
.cv-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.9}
.cv-brand{font-weight:800;letter-spacing:-.02em}
.cv-main{display:flex;align-items:flex-end;gap:30px}
.cv-main>div:first-child{flex:1}
.cv-hero h1{font-size:56px;letter-spacing:-.055em;margin:0 0 20px;line-height:1;animation:fadeUp .7s var(--ease) both}
.cv-hero h1 span{font-size:24px;font-weight:600;margin-left:12px;opacity:.85;letter-spacing:-.02em}
.cv-need{display:flex;gap:34px;animation:fadeUp .7s var(--ease) .1s both}
.cv-need div{display:flex;flex-direction:column;gap:4px}
.cv-need span{font-size:12px;opacity:.75}.cv-need b{font-size:16px}
.cv-bk{display:flex;flex-direction:column;gap:2px;align-items:flex-end;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:14px 18px;animation:fadeUp .7s var(--ease) .2s both}
.cv-bk span{font-size:11.5px;opacity:.75}.cv-bk b{font-size:16px}.cv-bk small{font-size:12.5px;opacity:.9}
.hl{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:40px}
.hl div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;animation:fadeUp .6s var(--ease) both}
.hl div:nth-child(2){animation-delay:.06s}.hl div:nth-child(3){animation-delay:.12s}.hl div:nth-child(4){animation-delay:.18s}
.hl span{font-size:12.5px;color:var(--muted);font-weight:600}
.hl b{font-size:20px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hl b i{font-style:normal;color:var(--muted);margin:0 4px;font-weight:500}
.hl b em{font-style:normal;font-size:15px;margin-left:3px;color:var(--ink2)}
.picks{grid-template-columns:repeat(2,1fr)!important;gap:16px!important}
.pk-ph{aspect-ratio:16/8!important}
.pk-b>b{font-size:18px!important}
.pk-kv{grid-template-columns:repeat(4,1fr)!important}
.pk-kv b{font-size:14px!important}.pk-kv small{font-size:11px;color:var(--muted)}
.print-only{display:none}
.xa{margin-bottom:40px}
.xt td{vertical-align:middle}
.xb{display:flex;flex-direction:column;gap:5px;min-width:110px}
.xb b{font-size:13.5px;font-variant-numeric:tabular-nums}
.xb span{height:6px;background:#f1f0ec;border-radius:3px;overflow:hidden}
.xb i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:3px;animation:grow .9s var(--ease) both}
.xs{display:flex;align-items:center;gap:8px}
.xs .ico{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2);display:flex;align-items:center;justify-content:center;flex:none}
.xs .ico svg{width:17px;height:17px}
.xs b{display:block;font-size:13px}.xs span{font-size:11.5px;color:var(--muted)}
.fp{margin-bottom:40px}
.fp-box{display:grid;grid-template-columns:1fr 260px;gap:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.fp-svg{width:100%;height:300px;display:block}
.fp-grid line{stroke:#ecebe6;stroke-width:.08}
.fp-s polygon{fill:var(--c);fill-opacity:.1;stroke:var(--c);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill-opacity .25s}
.fp-s:hover polygon{fill-opacity:.3}
.fp-svg .fp-s{animation:fadeIn .6s ease both}
.fp-leg{display:flex;flex-direction:column;gap:12px;justify-content:center}
.fp-li{display:flex;gap:10px;align-items:flex-start}
.fp-li i{width:12px;height:12px;border-radius:3px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);margin-top:3px;flex:none}
.fp-li b{display:block;font-size:13.5px}.fp-li span{font-size:12px;color:var(--muted)}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;font-weight:500;color:var(--ink2)}
.pmeta em{font-style:normal;color:var(--muted);margin-right:5px}
.plan-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-top:12px}
.pl-i{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fcfcfa;font-size:13px}
.lb-fig figcaption{flex-direction:column;align-items:center;gap:6px}
.lb-t{display:flex;gap:14px}
.lb .pmeta{color:#d8d6cf;justify-content:center}.lb .pmeta em{color:#8f8d86}
@media print{
  @page{size:A4;margin:12mm 11mm 14mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12px}
  .noprint,.top,.cp-bar,#toasts,.guide,.screen-only,.side,#viewer-root,#light-root{display:none!important}
  .print-only{display:block!important}
  .layout{display:block}.main{padding:0}
  .cp,.cp-wrap{background:#fff;padding:0!important;max-width:none}
  .print-stamp{display:block;font-size:10px;color:#666;border-bottom:1px solid #ccc;padding-bottom:5px;margin-bottom:14px}
  .pbreak{break-before:page}
  .lp-h h2{font-size:26px}
  .cv-hero{height:300px;border-radius:14px}.cv-hero h1{font-size:40px}
  .hl{margin-bottom:22px}.hl b{font-size:18px}
  .picks{grid-template-columns:1fr 1fr!important}
  .sec,.kpi,.kpis,.cm,.chart,.tile,.tiles,.insight,.store,.hl,.pk,.cv-hero,.mapwrap,.pmedia figure,.ctbl tr,.ftbl tr,.cmp tr,.spec-r{break-inside:avoid}
  .sec-h,.sec-t{break-after:avoid}
  .specs{display:block}.specs .sec{margin-bottom:12px}
  .sec{padding:14px 16px;margin-bottom:12px}
  .map{height:330px}
  .charts{grid-template-columns:1fr 1fr}
  .cols{height:100px}
  .stores{grid-template-columns:repeat(3,1fr)}
  .pmedia{display:grid;gap:8px}.pmedia.two{grid-template-columns:1fr 1fr}.pmedia.one{grid-template-columns:1fr}
  .pmedia figure{margin:0}.pmedia .fig{border:1px solid #e5e5e5;border-radius:6px;overflow:hidden}
  .pmedia.two .fig{aspect-ratio:4/3}.pmedia.one .fig{aspect-ratio:1000/640}
  .plans-sec{break-before:page;border:0;padding:0}
  .pmedia.one{gap:0}.pmedia.one figure+figure{break-before:page;padding-top:4mm}
  .pmedia.one .fig{border:0;width:100%}.pmedia.one figcaption{font-size:12px;color:#222;margin-top:8px;border-top:1px solid #ddd;padding-top:8px}
  .pmedia .pmeta{font-size:10.5px}.pmedia.one .pmeta{font-size:11.5px;gap:4px 18px}
  .pmedia figcaption{font-size:10px;color:#666;margin-top:3px}
  .anim .a,.bar,.b,.stack i,path.l,.store,.st-bar i,.hl div,.cv-mosaic i,.cv-hero *,.pg{animation:none!important}
  .cmp{overflow:visible}
  .cmp .tbl{font-size:10.5px}.cmp .tbl td,.cmp .tbl th{padding:6px 5px}
  .xb{min-width:0}.xs .ico{display:none}
  .fp-svg{height:220px}.fp-box{grid-template-columns:1fr 200px}
}
</style></style>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="viewer-root"></div>
<div id="light-root"></div>
<script>
/* =========================================================
   LeaseDesk prototype — single file, in-memory + localStorage
   ========================================================= */
const KEY = 'leasedesk-proto-v3';
const store = (() => { try { const t = '__t'; localStorage.setItem(t, t); localStorage.removeItem(t); return localStorage; } catch (e) { const m = {}; return {getItem: k => m[k] ?? null, setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; }, clear: () => {}}; } })();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const mkToken = () => Array.from({length: 12}, () => 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 55)]).join('');
const nf = (v, d = 0) => Number(v).toLocaleString('ko-KR', {maximumFractionDigits: d});
const clone = o => JSON.parse(JSON.stringify(o));
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((new Date(a + 'T00:00:00Z') - new Date(b + 'T00:00:00Z')) / 864e5);
const fmtDate = d => d ? d.replace(/-/g, '.') : '';
const fmtStamp = s => s ? s.slice(5, 10).replace('-', '.') + ' ' + s.slice(11, 16) : '';
const DOW = ['일','월','화','수','목','금','토'];
const stamp = () => S.today + 'T' + new Date().toTimeString().slice(0, 8);

/* ---------- media ---------- */
const IMG = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=1400&q=70`;
const PH = {
  seoulStreet: IMG('1517154421773-0529f29ea451'), seoulNeon: IMG('1538485399081-7191377e8241'), cheonggye: IMG('1601621915196-2621bfb0cd6e'),
  arcade: IMG('1481437156560-3205f6a55735'), openSign: IMG('1472851294608-062f824d29cc'),
  apparel: IMG('1441984904996-e0b6ba687e04'), apparel2: IMG('1555529771-835f59fc5efe'), apparel3: IMG('1567401893414-76b7b1e5a7a5'),
  cafeBar: IMG('1554118811-1e0d58224f24'), cafeSign: IMG('1501339847302-ac426a4a7cbb'), terrace: IMG('1559925393-8be0ec4767c8'), garden: IMG('1600093463592-8e36ae95ef56'),
  shopFront: IMG('1528698827591-e19ccd7bc23d'), shopIn: IMG('1441986300917-64674bd600d8'), cafe: IMG('1555396273-367ea4eb4db5'),
  shopLoft: IMG('1600508774634-4e11d34730e2'), brick: IMG('1538688525198-9b88f6f53126'), mall: IMG('1519567241046-7f570eee3ce6'),
  site: IMG('1541888946425-d81bb19240f5'), towerA: IMG('1486406146926-c627a92ad1ab'),
};
const SAMPLE_PHOTOS = [PH.shopFront, PH.shopLoft, PH.cafeBar, PH.apparel, PH.terrace, PH.brick, PH.site, PH.garden];

function svgURL(s) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }

/* realistic office core-type floor plan */
function officePlan(title, sub) {
  const X0 = 70, Y0 = 84, W = 860, H = 440, nx = 8, ny = 4, bx = W / nx, by = H / ny;
  const k = '#1b1b1b', g = '#8d8d8d';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica,Arial,sans-serif">
  <defs><pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9c9c9c" stroke-width=".8"/></pattern></defs>
  <rect width="1000" height="640" fill="#fff"/>`;
  for (let i = 0; i <= nx; i++) { const x = X0 + i * bx;
    s += `<line x1="${x}" y1="${Y0 - 36}" x2="${x}" y2="${Y0 + H + 16}" stroke="#cfcfcf" stroke-width=".6" stroke-dasharray="8 3 1.5 3"/><circle cx="${x}" cy="${Y0 - 46}" r="9" fill="#fff" stroke="${g}" stroke-width=".8"/><text x="${x}" y="${Y0 - 42.6}" font-size="8.5" text-anchor="middle" fill="#555">X${i + 1}</text>`; }
  for (let j = 0; j <= ny; j++) { const y = Y0 + j * by;
    s += `<line x1="${X0 - 36}" y1="${y}" x2="${X0 + W + 16}" y2="${y}" stroke="#cfcfcf" stroke-width=".6" stroke-dasharray="8 3 1.5 3"/><circle cx="${X0 - 46}" cy="${y}" r="9" fill="#fff" stroke="${g}" stroke-width=".8"/><text x="${X0 - 46}" y="${y + 3}" font-size="8.5" text-anchor="middle" fill="#555">Y${j + 1}</text>`; }
  // dimensions
  const dy = Y0 - 20;
  s += `<line x1="${X0}" y1="${dy}" x2="${X0 + W}" y2="${dy}" stroke="#777" stroke-width=".6"/>`;
  for (let i = 0; i <= nx; i++) { const x = X0 + i * bx; s += `<line x1="${x - 3}" y1="${dy + 3}" x2="${x + 3}" y2="${dy - 3}" stroke="#444" stroke-width="1"/>`; if (i < nx) s += `<text x="${x + bx / 2}" y="${dy - 4}" font-size="8" text-anchor="middle" fill="#666">8,400</text>`; }
  const dx = X0 + W + 30;
  s += `<line x1="${dx}" y1="${Y0}" x2="${dx}" y2="${Y0 + H}" stroke="#777" stroke-width=".6"/>`;
  for (let j = 0; j <= ny; j++) { const y = Y0 + j * by; s += `<line x1="${dx - 3}" y1="${y + 3}" x2="${dx + 3}" y2="${y - 3}" stroke="#444"/>`; if (j < ny) s += `<text x="${dx + 6}" y="${y + by / 2 + 3}" font-size="8" fill="#666">8,100</text>`; }
  // curtain wall
  s += `<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" fill="none" stroke="${k}" stroke-width="4.5"/><rect x="${X0 + 5}" y="${Y0 + 5}" width="${W - 10}" height="${H - 10}" fill="none" stroke="#999" stroke-width=".6"/>`;
  for (let x = X0; x <= X0 + W + .1; x += bx / 4) s += `<line x1="${x}" y1="${Y0 - 2}" x2="${x}" y2="${Y0 + 6}" stroke="${k}" stroke-width="1.2"/><line x1="${x}" y1="${Y0 + H - 6}" x2="${x}" y2="${Y0 + H + 2}" stroke="${k}" stroke-width="1.2"/>`;
  for (let y = Y0; y <= Y0 + H + .1; y += by / 3) s += `<line x1="${X0 - 2}" y1="${y}" x2="${X0 + 6}" y2="${y}" stroke="${k}" stroke-width="1.2"/><line x1="${X0 + W - 6}" y1="${y}" x2="${X0 + W + 2}" y2="${y}" stroke="${k}" stroke-width="1.2"/>`;
  // core
  const cx = X0 + 3 * bx, cy = Y0 + by, cw = 2 * bx, ch = 2 * by;
  s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="#f3f3f1" stroke="${k}" stroke-width="3.2"/>`;
  const stair = (x, y, w, h) => { let t = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="${k}" stroke-width="1.6"/><line x1="${x + w / 2}" y1="${y + 8}" x2="${x + w / 2}" y2="${y + h - 8}" stroke="${k}" stroke-width="1"/>`;
    for (let yy = y + 14; yy < y + h - 10; yy += 7) t += `<line x1="${x + 3}" y1="${yy}" x2="${x + w - 3}" y2="${yy}" stroke="#666" stroke-width=".6"/>`;
    return t + `<path d="M${x + w / 4} ${y + h - 14} V${y + 18} l-3 6 m3 -6 l3 6" fill="none" stroke="${k}" stroke-width=".8"/><text x="${x + w / 2}" y="${y + h + 11}" font-size="7.5" text-anchor="middle" fill="#555">계단실</text>`; };
  s += stair(cx + 6, cy + 6, 50, 98) + stair(cx + cw - 56, cy + ch - 112, 50, 98);
  for (let i = 0; i < 3; i++) { const ex = cx + 66 + i * 38, ey = cy + 8;
    s += `<rect x="${ex}" y="${ey}" width="34" height="34" fill="#fff" stroke="${k}" stroke-width="1.3"/><line x1="${ex}" y1="${ey}" x2="${ex + 34}" y2="${ey + 34}" stroke="#777" stroke-width=".6"/><line x1="${ex + 34}" y1="${ey}" x2="${ex}" y2="${ey + 34}" stroke="#777" stroke-width=".6"/><line x1="${ex + 8}" y1="${ey + 36}" x2="${ex + 26}" y2="${ey + 36}" stroke="${k}" stroke-width="2"/>`; }
  s += `<text x="${cx + 123}" y="${cy + 64}" font-size="8" text-anchor="middle" fill="#555">E/V 홀</text>`;
  // toilets
  const tx = cx + 6, ty = cy + ch - 104;
  s += `<rect x="${tx}" y="${ty}" width="74" height="46" fill="#fff" stroke="${k}" stroke-width="1.3"/><rect x="${tx}" y="${ty + 52}" width="74" height="46" fill="#fff" stroke="${k}" stroke-width="1.3"/>`;
  for (let i = 0; i < 4; i++) { s += `<rect x="${tx + 4 + i * 17}" y="${ty + 3}" width="14" height="16" fill="none" stroke="#777" stroke-width=".6"/><ellipse cx="${tx + 11 + i * 17}" cy="${ty + 10}" rx="3.5" ry="4.5" fill="none" stroke="#777" stroke-width=".6"/>`;
    s += `<rect x="${tx + 4 + i * 17}" y="${ty + 79}" width="14" height="16" fill="none" stroke="#777" stroke-width=".6"/><ellipse cx="${tx + 11 + i * 17}" cy="${ty + 88}" rx="3.5" ry="4.5" fill="none" stroke="#777" stroke-width=".6"/>`; }
  s += `<text x="${tx + 37}" y="${ty + 35}" font-size="7.5" text-anchor="middle" fill="#555">남자화장실</text><text x="${tx + 37}" y="${ty + 72}" font-size="7.5" text-anchor="middle" fill="#555">여자화장실</text>`;
  s += `<path d="M${tx + 74} ${ty + 30} a14 14 0 0 1 14 14" fill="none" stroke="#777" stroke-width=".6"/><path d="M${tx + 74} ${ty + 82} a14 14 0 0 0 14 -14" fill="none" stroke="#777" stroke-width=".6"/>`;
  // shafts
  [['EPS', cx + 96, cy + ch - 46], ['TPS', cx + 126, cy + ch - 46], ['PS', cx + 96, cy + ch - 76], ['AD', cx + 126, cy + ch - 76]].forEach(([l, x, y]) => {
    s += `<rect x="${x}" y="${y}" width="26" height="24" fill="url(#h)" stroke="${k}" stroke-width="1"/><text x="${x + 13}" y="${y + 15}" font-size="7" text-anchor="middle" fill="#333" font-weight="700">${l}</text>`; });
  s += `<rect x="${cx + 6}" y="${cy + 112}" width="54" height="30" fill="#fff" stroke="${k}" stroke-width="1"/><text x="${cx + 33}" y="${cy + 130}" font-size="7.5" text-anchor="middle" fill="#555">탕비실</text>`;
  // columns
  for (let i = 0; i <= nx; i++) for (let j = 0; j <= ny; j++) s += `<rect x="${X0 + i * bx - 7}" y="${Y0 + j * by - 7}" width="14" height="14" fill="${k}"/>`;
  // labels
  s += `<text x="${X0 + 1.5 * bx}" y="${Y0 + H / 2 + 4}" font-size="12" text-anchor="middle" fill="#a3a3a3" letter-spacing="3">OFFICE</text><text x="${X0 + 6.5 * bx}" y="${Y0 + H / 2 + 4}" font-size="12" text-anchor="middle" fill="#a3a3a3" letter-spacing="3">OFFICE</text>`;
  // north + scale + title
  s += `<g transform="translate(952,48)"><circle r="14" fill="none" stroke="#555" stroke-width=".8"/><path d="M0 -12 L5 6 L0 2 L-5 6Z" fill="${k}"/><text y="-17" font-size="8" text-anchor="middle" font-weight="700">N</text></g>`;
  s += `<g transform="translate(${X0},585)"><rect width="40" height="5" fill="${k}"/><rect x="40" width="40" height="5" fill="#fff" stroke="${k}" stroke-width=".8"/><rect x="80" width="80" height="5" fill="${k}"/><text y="17" font-size="8" fill="#555">0</text><text x="40" y="17" font-size="8" fill="#555" text-anchor="middle">5</text><text x="80" y="17" font-size="8" fill="#555" text-anchor="middle">10</text><text x="160" y="17" font-size="8" fill="#555" text-anchor="middle">20m</text></g>`;
  s += `<g transform="translate(700,566)"><rect width="230" height="46" fill="#fff" stroke="${k}" stroke-width="1"/><line x1="0" y1="26" x2="230" y2="26" stroke="${k}" stroke-width=".6"/><text x="10" y="18" font-size="11" font-weight="700">${esc(title)}</text><text x="10" y="39" font-size="8.5" fill="#555">${esc(sub)}</text><text x="220" y="39" font-size="8.5" fill="#555" text-anchor="end">S=1/400</text></g>`;
  return svgURL(s + '</svg>');
}

/* realistic street-front retail plan */
function retailPlan(title, sub, street, upper) {
  const X0 = 140, Y0 = 70, W = 720, H = 380, k = '#1b1b1b';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica,Arial,sans-serif">
  <defs><pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9c9c9c" stroke-width=".8"/></pattern></defs>
  <rect width="1000" height="640" fill="#fff"/>`;
  // party walls (hatched) + rear wall
  s += `<rect x="${X0 - 14}" y="${Y0 - 14}" width="${W + 28}" height="14" fill="url(#h)" stroke="${k}" stroke-width="1.2"/>`;
  s += `<rect x="${X0 - 14}" y="${Y0}" width="14" height="${H}" fill="url(#h)" stroke="${k}" stroke-width="1.2"/><rect x="${X0 + W}" y="${Y0}" width="14" height="${H}" fill="url(#h)" stroke="${k}" stroke-width="1.2"/>`;
  const gy = Y0 + H, ex = X0 + W / 2 - 40;
  if (upper) {
    s += `<rect x="${X0 - 14}" y="${gy}" width="${W + 28}" height="10" fill="url(#h)" stroke="${k}" stroke-width="1.2"/>`;
    for (let x = X0 + 40; x < X0 + W - 60; x += 110) s += `<rect x="${x}" y="${gy + 2}" width="70" height="6" fill="#fff" stroke="${k}" stroke-width=".8"/><line x1="${x}" y1="${gy + 5}" x2="${x + 70}" y2="${gy + 5}" stroke="#777" stroke-width=".5"/>`;
    s += `<text x="${X0 + W / 2}" y="${gy + 30}" font-size="8" text-anchor="middle" fill="#999">도로 측 창호</text>`;
  } else {
  s += `<line x1="${X0}" y1="${gy}" x2="${ex}" y2="${gy}" stroke="${k}" stroke-width="1"/><line x1="${X0}" y1="${gy + 4}" x2="${ex}" y2="${gy + 4}" stroke="${k}" stroke-width="1"/><line x1="${ex + 80}" y1="${gy}" x2="${X0 + W}" y2="${gy}" stroke="${k}" stroke-width="1"/><line x1="${ex + 80}" y1="${gy + 4}" x2="${X0 + W}" y2="${gy + 4}" stroke="${k}" stroke-width="1"/>`;
  for (let x = X0; x <= X0 + W; x += 48) if (x < ex || x > ex + 80) s += `<rect x="${x - 2}" y="${gy - 1}" width="4" height="6" fill="${k}"/>`;
  s += `<path d="M${ex} ${gy} a40 40 0 0 0 40 -40 M${ex} ${gy} l40 -40" fill="none" stroke="#666" stroke-width=".7"/><path d="M${ex + 80} ${gy} a40 40 0 0 1 -40 -40 M${ex + 80} ${gy} l-40 -40" fill="none" stroke="#666" stroke-width=".7"/>`;
  s += `<text x="${ex + 40}" y="${gy + 20}" font-size="8.5" text-anchor="middle" fill="#333" font-weight="700">주출입구</text>`;
  // sidewalk / street
  s += `<line x1="60" y1="${gy + 44}" x2="940" y2="${gy + 44}" stroke="#999" stroke-width="1"/><line x1="60" y1="${gy + 100}" x2="940" y2="${gy + 100}" stroke="#999" stroke-width=".6" stroke-dasharray="14 10"/><text x="500" y="${gy + 78}" font-size="11" text-anchor="middle" fill="#888" letter-spacing="4">${esc(street)}</text><text x="80" y="${gy + 34}" font-size="8" fill="#999">보도</text>`;
  }
  // rear service: stair, wc, back door
  const sx = X0 + 8, sy = Y0 + 8;
  s += `<rect x="${sx}" y="${sy}" width="62" height="120" fill="#fff" stroke="${k}" stroke-width="1.6"/><line x1="${sx + 31}" y1="${sy + 8}" x2="${sx + 31}" y2="${sy + 112}" stroke="${k}"/>`;

function advance(n) {

    }
    for (const B of S.buildings) {
      const r = REGISTRY.find(x => x.pnu === B.pnu);
      if (B.status === '인허가' && r.final && S.today >= r.final.at) {
        const old = B.gfa; Object.assign(B, {status: '준공', gfa: r.final.gfa, year: r.final.year});
        S.listings.filter(L => L.buildingId === B.id).forEach(L => note(L.ownerId, `<b>${esc(B.name)}</b> 건축물대장 등록 · 연면적 ${nf(old)} → ${nf(B.gfa)}㎡`));
        reasons.add('건축물대장 반영');
      }
    }
    if (S.today.slice(0, 7) !== prev.slice(0, 7)) {
      const m = prevMonth(S.today); S.fx = {month: m, rates: fxFor(m)};
      reasons.add('환율 갱신');

    }

  toast(`${fmtDate(S.today)} (${DOW[new Date(S.today).getDay()]})`, c ? `제안서 ${c}건 재생성` : '변경 없음');
}

const MEDIA = {};
function planItems(floors, title) {
  const out = []; const fs = floors.filter(f => f.plan).sort((a, b) => a.floor - b.floor);
  for (const f of fs) {
    const last = out[out.length - 1];
    if (last && !f.poly && !last.poly && last.src === f.plan && last.to === f.floor - 1 && last.scope === f.scope) last.to = f.floor;
    else out.push({kind: 'plan', src: f.plan, poly: f.poly, scope: f.scope, from: f.floor, to: f.floor, areas: []});
    out[out.length - 1].areas.push(+f.area || 0);
  }
  out.forEach(m => {
    const fl = m.from === m.to ? fmtF(m.from) : fmtF(m.from) + '–' + fmtF(m.to), tot = m.areas.reduce((a, b) => a + b, 0);
    m.cap = `${fl} 평면도`;
    m.meta = [['건물', esc(title || '')], ['층', fl + (m.areas.length > 1 ? ` (${m.areas.length}개 층)` : '')], ['범위', m.scope === '일부' ? '층 일부 임대 · 파란 영역' : '층 전체 임대'],
      ['임대면적', `${nf(tot)}㎡ (${nf(tot * SQFT)} sq ft) · ${nf(tot * PYR, 1)}평` + (m.areas.length > 1 ? ` · 층당 ${m.areas.map(a => nf(a)).join(' / ')}㎡` : '')]];
  });
  return out;
}
function planSvg(m) {
  return `<svg class="plansvg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"><image href="${m.src}" width="1000" height="640"/>${m.poly ? `<polygon class="poly" vector-effect="non-scaling-stroke" points="${m.poly.map(([x, y]) => `${(x * 1000).toFixed(1)},${(y * 640).toFixed(1)}`).join(' ')}"/>` : ''}</svg>`;
}
function metaHtml(m) { return m.meta ? `<div class="pmeta">${m.meta.map(([k, v]) => `<span><em>${k}</em>${v}</span>`).join('')}</div>` : ''; }
function fig(m, eager) { return m.kind === 'plan' ? `<div class="fig plan">${planSvg(m)}</div>` : `<div class="fig photo"><img src="${m.src}" ${eager ? '' : 'loading="lazy"'} alt=""></div>`; }
function mosaic(key, items, tab, label) {
  if (!items.length) return '';

  return `<div class="gal n${sh.length} ${tab}">${sh.map((m, j) => `<button class="gcell" onclick="openViewer('${key}','${tab}')">${fig(m)}${j === sh.length - 1 && more > 0 ? `<span class="more">+${more}</span>` : ''}</button>`).join('')}

const MAPS = {};
const HEAT_C = ['#fee7d6', '#fcc39d', '#f7955e', '#e8622b', '#b8410f'];
const COMMUTE = [1, 30, 12, 9, 34, 6];
function mapSection(x, key) {
  if (!x.geo) return '';
  MAPS[key] = {...x.geo, title: x.title, area: x.area};
  const a = x.area, slots = a ? a.hourly.map(h => h[0]) : [];
  return `<section class="sec map-sec"><div class="sec-h"><h3>위치 · 시간대별 유동인구</h3>${a ? '<span class="chip line">예시 데이터</span>' : ''}<div class="sp"></div><span class="sub">${esc(x.address)}</span></div>
    <div class="mapwrap"><div class="map" data-key="${key}"></div>
    ${a ? `<div class="map-time noprint"><button class="play" onclick="togglePlay()" title="재생">${U.playing ? '❚❚' : '▶'}</button>${slots.map((h, i) => `<button class="slot ${U.slot === i ? 'on' : ''}" data-i="${i}" onclick="setSlot(${i})">${h}시</button>`).join('')}</div>
      <div class="map-leg"><span>시간당 유동인구</span><div class="ramp">${HEAT_C.map(c => `<i style="background:${c}"></i>`).join('')}</div><div class="ramp-l"><span>적음</span><span>많음</span></div></div>` : ''}</div>
    ${a ? `<div class="map-note" data-key="${key}"></div>` : `<div class="map-note"><span class="sub">서울 외 지역은 상권 데이터를 제공하지 않습니다</span></div>`}</section>`;
}
function heatCells(d) {
  let seed = Math.abs(Math.round(d.lat * 1e4) * 7 + Math.round(d.lng * 1e4)) % 2147483646 + 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const st = d.stn ? {lat: d.stn[1], lng: d.stn[2]} : null, out = [], N = 8, dLa = 0.00055, dLn = 0.0007;
  for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
    if (i * i + j * j > N * N) continue;
    const lat = d.lat + i * dLa + (rnd() - .5) * dLa * .35, lng = d.lng + j * dLn + (rnd() - .5) * dLn * .35;
    const dist = (la, ln) => Math.hypot((la - lat) / 0.0009, (ln - lng) / 0.00113);
    let street = Math.exp(-(dist(d.lat, d.lng) ** 2) / 6), stc = 0, corr = 0;
    if (st) {
      stc = Math.exp(-(dist(st.lat, st.lng) ** 2) / 4);
      const vx = st.lat - d.lat, vy = st.lng - d.lng, L2 = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((lat - d.lat) * vx + (lng - d.lng) * vy) / L2));
      corr = Math.exp(-(dist(d.lat + t * vx, d.lng + t * vy) ** 2) / 1.2);
    }
    const noise = rnd();
    out.push({lat, lng, street: street + corr * .55 + noise * .18, station: stc + corr * .35, self: i === 0 && j === 0});
  }
  return out;
}
const LIVE_MAPS = [];
function initMaps() {
  for (let i = LIVE_MAPS.length - 1; i >= 0; i--) if (!document.body.contains(LIVE_MAPS[i].getContainer())) { LIVE_MAPS[i].remove(); LIVE_MAPS.splice(i, 1); }
  if (!window.L) return;
  document.querySelectorAll('.map[data-key]:not(.ready)').forEach(el => {
    const d = MAPS[el.dataset.key]; if (!d) return;
    el.classList.add('ready');
    const m = L.map(el, {scrollWheelZoom: false, zoomControl: false, attributionControl: true, zoomSnap: .5, maxZoom: 18}).setView([d.lat, d.lng], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap', maxZoom: 19, className: 'osm-tiles'}).addTo(m);
    if (d.area) {
      const cells = heatCells(d), a = d.area;
      const vals = s => cells.map(c => c.street * a.hourly[s][1] + c.station * COMMUTE[s]);
      let max = 0; for (let s = 0; s < 6; s++) max = Math.max(max, ...vals(s));
      const scale = a.pop[2][1] / 24 / 6 / max * 3.2;
      m._heat = {d, vals, max, scale, cells, circles: cells.map(c => L.circle([c.lat, c.lng], {radius: 30, stroke: false, fillOpacity: 0, interactive: false}).addTo(m))};
      drawHeat(m);
    }
    L.circle([d.lat, d.lng], {radius: 300, color: '#2a78d6', weight: 1.2, dashArray: '5 5', fill: false, interactive: false}).addTo(m);
    if (d.stn) L.marker([d.stn[1], d.stn[2]], {icon: L.divIcon({className: '', html: `<div class="stn-b"><i>M</i>${esc(d.stn[0])}</div>`, iconSize: null, iconAnchor: [12, 12]})}).addTo(m);
    L.marker([d.lat, d.lng], {icon: L.divIcon({className: '', html: `<div class="pin"><div class="pin-l">${esc(d.title)}</div><div class="pin-b"></div></div>`, iconSize: null, iconAnchor: [0, 0]})}).addTo(m);
    L.control.zoom({position: 'bottomright'}).addTo(m);
    LIVE_MAPS.push(m);
  });
}
function drawHeat(m) {
  const h = m._heat; if (!h) return;
  const vs = h.vals(U.slot), th = [.1, .22, .38, .58].map(t => t * h.max);
  h.circles.forEach((c, i) => { const v = vs[i], k = th.filter(t => v > t).length;
    c.setStyle({fillColor: HEAT_C[k], fillOpacity: k === 0 ? 0 : .22 + k * .12}); });
  const ci = h.cells ? h.cells.findIndex(c => c.self) : -1, near = Math.round(vs[ci >= 0 ? ci : Math.floor(vs.length / 2)] * h.scale / 10) * 10;
  const note = document.querySelector(`.map-note[data-key="${m.getContainer().dataset.key}"]`);
  if (note) note.innerHTML = `<b>${h.d.area.hourly[U.slot][0]}시</b><span>매물 앞 시간당 약 <b>${nf(near)}명</b></span><span class="sub">· 반경 300m 점선 = 상권 영역</span>`;
}
function setSlot(i, auto) {
  if (!auto && U.playing) togglePlay();
  U.slot = i;
  document.querySelectorAll('.slot').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  LIVE_MAPS.forEach(drawHeat);
}
function togglePlay() {
  if (U.playing) { clearInterval(U.playing); U.playing = null; }
  else { U.playing = setInterval(() => { if (!LIVE_MAPS.some(m => m._heat)) return togglePlay(); setSlot((U.slot + 1) % 6, true); }, 1300); }
  document.querySelectorAll('.play').forEach(b => b.textContent = U.playing ? '❚❚' : '▶');
}

/* ---------- footprint comparison (same scale) ---------- */
const FP_C = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
function polyArea(pts) { let a = 0; for (let i = 0; i < pts.length; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length]; a += x1 * y2 - x2 * y1; } return Math.abs(a) / 2; }
function footprint(x) {
  const fs = [...x.floors].sort((a, b) => a.floor - b.floor);
  const f = fs.find(v => v.floor === 1) || fs.find(v => v.floor > 0) || fs[0];
  const area = +f.area || 0; if (!area) return null;
  let pts;
  if (f.poly && f.poly.length >= 3) pts = f.poly.map(([u, v]) => [u * 1000, v * 640]);
  else pts = [[0, 0], [21.6, 0], [21.6, 11.4], [0, 11.4]];
  const k = Math.sqrt(area / polyArea(pts));
  pts = pts.map(([u, v]) => [u * k, v * k]);
  const minX = Math.min(...pts.map(p => p[0])), minY = Math.min(...pts.map(p => p[1]));
  pts = pts.map(([u, v]) => [u - minX, v - minY]);
  return {pts, w: Math.max(...pts.map(p => p[0])), h: Math.max(...pts.map(p => p[1])), area, floor: f.floor, multi: fs.length > 1};
}
function fpCompare(P) {
  const items = P.items.map((x, i) => ({x, i})).filter(o => !o.x.ended).map(o => ({...o, fp: footprint(o.x)})).filter(o => o.fp);
  if (items.length < 2) return '';
  const side = U.fpMode === 'side', gap = 4, pad = 3;
  let off = 0; items.forEach(o => { o.ox = side ? off : 0; off += o.fp.w + gap; });
  const W = (side ? off - gap : Math.max(...items.map(o => o.fp.w))) + pad * 2 + 8, H = Math.max(...items.map(o => o.fp.h)) + pad * 2 + 4;
  const grid = []; for (let gx = 0; gx <= W; gx += 5) grid.push(`<line x1="${gx + pad}" y1="0" x2="${gx + pad}" y2="${H}"/>`); for (let gy = 0; gy <= H; gy += 5) grid.push(`<line x1="0" y1="${H - pad - gy}" x2="${W}" y2="${H - pad - gy}"/>`);
  const shape = o => { const c = FP_C[o.i % 8], pts = o.fp.pts.map(([u, v]) => `${(u + o.ox + pad).toFixed(2)},${(H - pad - (o.fp.h - v)).toFixed(2)}`).join(' ');
    return `<g class="fp-s" style="--c:${c}"><title>${pad2(o.i + 1)} ${o.x.title} · ${fmtF(o.fp.floor)} ${nf(o.fp.area)}㎡</title><polygon points="${pts}"/></g>`; };
  return `<div class="fp"><div class="row" style="margin-bottom:12px"><h3 class="sec-t" style="margin:0">면적 비교 · 동일 축척</h3><span class="sub">1층 기준 · 복층 매물도 1층만 비교 · 격자 5m</span><div class="sp"></div>
      <div class="seg sm noprint"><button class="${!side ? 'on' : ''}" onclick="U.fpMode='overlay';rerenderClient()">겹쳐 보기</button><button class="${side ? 'on' : ''}" onclick="U.fpMode='side';rerenderClient()">나란히 보기</button></div></div>
    <div class="fp-box"><svg class="fp-svg" viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" preserveAspectRatio="xMinYMax meet"><g class="fp-grid">${grid.join('')}</g>${items.map(shape).join('')}</svg>
      <div class="fp-leg">${items.map(o => `<div class="fp-li" style="--c:${FP_C[o.i % 8]}"><i></i><div><b>${pad2(o.i + 1)} ${esc(o.x.title)}</b><span>${fmtF(o.fp.floor)} ${nf(o.fp.area)}㎡ · ${nf(o.fp.area * PYR, 1)}평${o.fp.multi ? ` · 전체 ${nf(o.x.leaseArea)}㎡` : ''}</span></div></div>`).join('')}</div></div></div>`;
}

function searchRes(res) {

  if (!res.length) return `<div class="search-res"><button disabled><span class="sub">검색 결과 없음</span></button></div>`;
  return `<div class="search-res">${res.map(x => `<button onclick="pickReg('${x.pnu}')"><div style="flex:1"><b>${esc(x.address)}</b><div class="sub">${esc(x.name || '—')} · PNU ${x.pnu}</div></div>${x.status === '준공' ? '<span class="chip ok">대장</span>' : x.status === '인허가' ? '<span class="chip warn">인허가</span>' : '<span class="chip red">정보없음</span>'}</button>`).join('')}</div>`;
}
function renderSearch() { const res = D.q ? REGISTRY.filter(x => x.address.replace(/\s/g, '').includes(D.q.replace(/\s/g, ''))) : []; $('#sr').innerHTML = searchRes(res); }
function ensureBuilding(pnu) {
  let B = S.buildings.find(b => b.pnu === pnu);
  if (!B) { const r = REGISTRY.find(x => x.pnu === pnu); B = {id: uid('B'), ...clone(r)}; delete B.final; S.buildings.push(B); }
  return B;
}
function saveListing() {
  if (!D.pnu) return toast('건물을 선택하세요');
  if (!D.floors.length) return toast('임대 범위를 지정하세요');
  const noArea = D.floors.find(f => !(+f.area > 0));
  if (noArea) return toast(`${fmtF(noArea.floor)} 임대면적을 입력하세요`);
  D.leaseArea = sumArea(D.floors);
  const miss = D.floors.find(f => f.scope === '일부' && !f.poly);
  if (miss) return toast(`${fmtF(miss.floor)} 영역을 칠하세요`);
  for (const k of ['deposit', 'rent', 'mgmt', 'keyMoney', 'handover']) if (D[k].s === 'v' && (D[k].v === '' || D[k].v == null)) return toast('금액/날짜가 비어 있습니다', '협의 또는 미정으로 바꿀 수 있습니다');
  const B = ensureBuilding(D.pnu);
  const data = clone(D); delete data.pnu; delete data.q; delete data.range; delete data.from;
  data.buildingId = B.id;
  let n;
  if (!D.id) {
    Object.assign(data, {id: uid('L'), ownerId: me(), status: 'active', upd: {}, grants: [], createdAt: stamp()});
    S.listings.push(data);
    if (D.from) { const src = getL(D.from); src.grants = (src.grants || []).filter(u => u !== me()); }
    D = null; n = commit('매물 등록'); toast('등록 완료', B.status === '인허가' ? '인허가 정보 기준 · 대장 등록 시 자동 갱신' : '');
  } else {
    const L = getL(D.id);
    PUB.forEach(k => { if (JSON.stringify(L[k] ?? null) !== JSON.stringify(data[k] ?? null)) data.upd[k] = stamp(); });
    Object.assign(L, data);
    D = null; n = commit('매물 수정');
    toast('저장 완료', n ? `제안서 ${n}건 자동 재생성` : '클라이언트 페이지 변경 없음');
  }
  window.scrollTo({top: 0});
}

function setCover(pid, k, v) { getP(pid).cover[k] = v; const n = commit('표지 수정'); if (n) toast('클라이언트 페이지 갱신'); }
function setComment(pid, i, v) { getP(pid).items[i].comment = v; const n = commit('코멘트 수정'); if (n) toast('코멘트 반영', '클라이언트 페이지 갱신'); }
function setPin(pid, v) { if (!/^\d{4}$/.test(v)) { toast('PIN은 숫자 4자리'); return render(); } getP(pid).pin = v; save(); toast('PIN 변경'); }
function moveItem(pid, i, d) { const it = getP(pid).items; [it[i], it[i + d]] = [it[i + d], it[i]]; commit('순서 변경'); }
function rmItem(pid, i) { getP(pid).items.splice(i, 1); commit('물건 제외'); toast('제외됨'); }
function addItem(pid, lid) {
  const p = getP(pid), L = getL(lid);
  if (p.items.some(x => x.listingId === lid)) return toast('이미 포함된 물건');
  p.items.push({listingId: lid, comment: '', addedAt: stamp()});
  if (L.ownerId !== me()) note(L.ownerId, `${USERS[me()].name}님이 <b>${esc(bInfo(L).name)} · ${esc(floorLabel(L.floors, L.leaseType))}</b>를 ${esc(p.clientName)} 제안서에 추가했습니다`);
  commit('물건 추가'); toast('추가됨', `${p.clientName} 제안서`);
}
function copyLink(pid) { const p = getP(pid); navigator.clipboard?.writeText(linkOf(p)); toast('링크 복사됨', `PIN ${p.pin}는 별도로 전달하세요`); }
function reissue(pid) {
  const p = getP(pid); p.oldTokens.push(p.token); p.token = mkToken();
  S.msgs.push({client: p.clientId, pid: p.id, from: p.ownerId, token: p.token, at: stamp(), text: '링크가 재발급되었습니다. 이전 링크는 더 이상 열리지 않습니다.'});

function createProp(form) {

/* ---------- admin ---------- */
function conflicts() {
  const act = S.listings.filter(L => L.status === 'active'), out = [];
  for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
    const a = act[i], b = act[j];
    if (a.buildingId !== b.buildingId || a.ownerId === b.ownerId) continue;
    const ov = a.floors.map(f => f.floor).filter(f => b.floors.some(g => g.floor === f));
    if (ov.length) out.push({a, b, ov});
  }
  return out;
}
function adminView() {
  const t = U.tab.admin;
  if (t === 'over') return adminOver();
  if (t === 'bld') return adminBld();
  if (t === 'handover') return adminHand();
  if (t === 'views') return adminViews();
  if (t === 'log') return logView();
}
function adminOver() {
  const act = S.listings.filter(L => L.status === 'active'), cf = conflicts();

    ${cf.map(c => `<div class="conf"><span style="font-size:20px">⚠︎</span><div style="flex:1"><b>${esc(bInfo(c.a).name)}</b> · ${c.ov.join(', ')}F<div class="sub">${USERS[c.a.ownerId].name} (${esc(floorLabel(c.a.floors, c.a.leaseType))}, ${c.a.visibility === 'shared' ? '공유' : '나만'}) ↔ ${USERS[c.b.ownerId].name} (${esc(floorLabel(c.b.floors, c.b.leaseType))}, ${c.b.visibility === 'shared' ? '공유' : '나만'})</div></div><button class="btn sm" onclick="U.tab.admin='bld';U.open['${c.a.buildingId}']=true;render()">보기</button></div>`).join('') || '<div class="sub">중복 없음</div>'}</div>
  <div class="panel a" style="--i:5"><h3>용역 만료 30일 이내 <span class="chip">${soon.length}</span></h3>
    <table class="tbl"><tbody>${soon.map(L => `<tr><td><b>${esc(bInfo(L).name)}</b> <span class="sub">${esc(floorLabel(L.floors, L.leaseType))}</span></td><td>${USERS[L.ownerId].name}</td><td class="num">${fmtDate(L.mEnd)}</td><td class="num"><span class="chip ${diffDays(L.mEnd, S.today) <= 14 ? 'warn' : ''}">D-${diffDays(L.mEnd, S.today)}</span></td></tr>`).join('') || '<tr><td class="sub">없음</td></tr>'}</tbody></table></div>`;
