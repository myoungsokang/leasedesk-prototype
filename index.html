    const p = S.proposals.find(x => x.token === c.token || x.oldTokens.includes(c.token));
    if (!p || p.oldTokens.includes(c.token)) return `<div class="gate"><div class="card a"><div class="lock" style="background:var(--danger-soft);color:var(--danger)">⦸</div><h2 style="margin:0 0 6px">만료된 링크</h2><p class="sub">이 링크는 더 이상 사용할 수 없습니다.<br>담당 브로커에게 최신 링크를 요청하세요.</p><button class="btn" style="margin-top:14px" onclick="U.client={};render()">돌아가기</button></div></div>`;
    if (!c.ok) return `<div class="gate"><div class="card a" id="gc"><div class="lock">🔒</div><h2 style="margin:0 0 4px">${esc(p.clientName)} 제안서</h2><p class="sub" style="margin:0">담당 브로커에게 받은 PIN 4자리</p>
      <div class="pin">${[0, 1, 2, 3].map(i => `<input inputmode="numeric" maxlength="1" oninput="pinIn(this,${i})" onkeydown="if(event.key==='Backspace'&&!this.value&&this.previousElementSibling)this.previousElementSibling.focus()">`).join('')}</div>
      <button class="btn ghost sm" onclick="U.client={};render()">취소</button></div></div>`;
    return clientPage(p.snap, p.genAt, linkOf(p));
  }
  const ms = S.msgs.filter(m => m.client === 'clientA').slice().reverse();
  return `<div class="main" style="max-width:720px;margin:0 auto"><div class="head"><h1>받은 메시지</h1><span class="sub">${CLIENTS.clientA} · 총무팀</span></div>
    ${ms.map((m, i) => `<div class="mail a" style="--i:${i}" onclick="openLink('${m.token}')"><div class="av">${USERS[m.from].name[0]}</div><div style="flex:1;min-width:0"><div class="row"><b>${USERS[m.from].name}</b><span class="sub">C&amp;W Advisory</span><div class="sp"></div><span class="sub">${fmtStamp(m.at)}</span></div><div style="margin-top:4px">${esc(m.text)}</div><div class="url">https://p.cw-advisory.kr/${m.token}</div></div></div>`).join('')}</div>`;
}
function openLink(t) { U.client = {token: t, ok: false}; U.page = 0; render(); setTimeout(() => document.querySelector('.pin input')?.focus(), 50); window.scrollTo({top: 0}); }
function pinIn(el, i) {
  el.value = el.value.replace(/\D/g, '');
  if (el.value && el.nextElementSibling) el.nextElementSibling.focus();
  const ins = [...document.querySelectorAll('.pin input')], v = ins.map(x => x.value).join('');
  if (v.length < 4) return;
  const p = S.proposals.find(x => x.token === U.client.token);
  if (v === p.pin) { p.views.push({at: stamp()}); save(); U.client.ok = true; render(); }
  else { const g = $('#gc'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); ins.forEach(x => x.value = ''); ins[0].focus(); }
}

/* ---------- modals ---------- */
function openModal(m) { U.modal = m; if (m.type === 'preview') U.page = 0; if (m.type === 'poly') m.pts = clone(D.floors[m.fi].poly || []); renderModal(); }
function closeModal() { U.modal = null; renderModal(); }
function renderModal() {
  const m = U.modal, root = $('#modal-root');
  if (!m) { root.innerHTML = ''; initMaps(); return; }
  let h = '';
  if (m.type === 'poly') {
    const f = D.floors[m.fi], plan = D.plans.find(p => p.id === f.planId);
    const pts = m.pts.map(p => p.join(',')).join(' ');
    h = `<div class="modal wide"><div class="mh"><b>${f.floor}F 임대 영역</b><span class="sub">클릭해서 꼭짓점 추가</span><div class="sp"></div>
      <button class="btn sm ghost" onclick="U.modal.pts.pop();renderModal()" ${m.pts.length ? '' : 'disabled'}>되돌리기</button><button class="btn sm ghost" onclick="U.modal.pts=[];renderModal()">초기화</button><button class="btn sm pri" onclick="savePoly()" ${m.pts.length >= 3 ? '' : 'disabled'}>완료</button></div>
      <div class="mb"><div class="stage" onclick="polyClick(event)"><img src="${plan.src}" draggable="false"><svg viewBox="0 0 1 1" preserveAspectRatio="none">${m.pts.length >= 2 ? `<polygon class="poly" vector-effect="non-scaling-stroke" points="${pts}"/>` : ''}</svg>${m.pts.map((p, i) => `<span class="pt ${i === 0 ? 'first' : ''}" style="left:${p[0] * 100}%;top:${p[1] * 100}%"></span>`).join('')}</div></div></div>`;
  } else if (m.type === 'pick') {
    const p = getP(m.pid), avail = S.listings.filter(L => live(L, me()) && !p.items.some(x => x.listingId === L.id));
    h = `<div class="modal"><div class="mh"><b>물건 추가</b><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="mb">
      ${avail.map(L => `<div class="pick"><div class="pi" style="background-image:url('${L.photos[0]}')"></div><div style="flex:1"><b>${esc(bInfo(L).name)}</b> <span class="sub">${esc(floorLabel(L.floors, L.leaseType))}</span><div class="pick-kv"><span>1층 <b>${area1F(L.floors) != null ? nf(area1F(L.floors)) + '㎡' : '–'}</b></span><span>전체 <b>${nf(L.leaseArea)}㎡</b></span><span>임대료 <b>${priceShort(L.rent)}</b></span>${L.ownerId !== me() ? `<span>담당 <b>${USERS[L.ownerId].name}</b></span>` : ''}</div></div><button class="btn sm" onclick="addItem('${p.id}','${L.id}');renderModal()">추가</button></div>`).join('') || '<div class="empty">추가할 물건 없음</div>'}</div></div>`;
  } else if (m.type === 'toProp') {
    const ps = S.proposals.filter(p => p.ownerId === me()), L = getL(m.lid);
    h = `<div class="modal"><div class="mh"><b>${esc(bInfo(L).name)} → 제안서</b><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="mb">
      ${ps.map(p => { const has = p.items.some(x => x.listingId === m.lid); return `<div class="pick"><div style="flex:1"><b>${esc(p.clientName)}</b><div class="sub">${p.items.length}건</div></div>${has ? '<span class="chip ok">포함됨</span>' : `<button class="btn sm" onclick="addItem('${p.id}','${m.lid}');renderModal()">추가</button>`}</div>`; }).join('') || '<div class="empty">제안서가 없습니다</div>'}
      <button class="btn sm" style="margin-top:10px" onclick="openModal({type:'newProp'})">+ 새 제안서</button></div></div>`;
  } else if (m.type === 'newProp') {
    h = `<div class="modal"><div class="mh"><b>새 제안서</b><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
      <form class="mb" onsubmit="event.preventDefault();createProp(this)"><div class="fg" style="grid-template-columns:1fr 1fr">
      <div class="f"><label>클라이언트</label><select class="in" name="client" onchange="this.form.cname.disabled=this.value==='clientA'"><option value="clientA">한빛테크 (클라이언트A)</option><option value="other">직접 입력</option></select></div>
      <div class="f"><label>클라이언트명</label><input class="in" name="cname" disabled placeholder="회사명"></div>
      <div class="f"><label>희망 지역</label><input class="in" name="region" placeholder="성수 · 강남"></div>
      <div class="f"><label>면적</label><input class="in" name="size" placeholder="1,000–1,500㎡"></div>
      <div class="f"><label>입주 시기</label><input class="in" name="moveIn" placeholder="2027년 상반기"></div></div>
      <div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn pri">생성</button></div></form></div>`;
  } else if (m.type === 'detail') {
    const L = getL(m.lid);
    const own = L.ownerId === me();
    h = `<div class="modal full"><div class="mh" style="background:#fbfbf9"><b>제안서 미리보기</b><span class="sub">클라이언트에게 보이는 화면</span><div class="sp"></div>
      ${own ? `<button class="btn sm" onclick="closeModal();editListing('${L.id}')">수정</button>` : ''}${L.status === 'active' ? `<button class="btn sm pri" onclick="openModal({type:'toProp',lid:'${L.id}'})">+ 제안서</button>` : ''}<button class="btn sm ghost" onclick="closeModal()">✕</button></div>
      <div class="cp"><div class="cp-wrap" style="padding-top:28px">${listingPage(projItem(L, null, L.ownerId), 0, 0, S.fx)}</div></div></div>`;
  } else if (m.type === 'preview') {
    const p = getP(m.pid);
    h = `<div class="modal full"><div class="mh" style="background:#fff"><b>클라이언트 화면</b><span class="sub">${linkOf(p)}</span><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div>${clientPage(p.snap, p.genAt)}</div>`;
  }
  root.innerHTML = `<div class="back" onclick="if(event.target===this)closeModal()">${h}</div>`;
  initMaps();
}
function polyClick(e) {
  const r = e.currentTarget.getBoundingClientRect();
  U.modal.pts.push([+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)]);
  renderModal();
}
function savePoly() { D.floors[U.modal.fi].poly = U.modal.pts; U.modal = null; renderModal(); render(); toast('영역 저장'); }

/* ---------- toast ---------- */
function toast(t, s) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `${esc(t)}${s ? `<small>${esc(s)}</small>` : ''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2800);
}
document.addEventListener('keydown', e => {
  if (VIEW) {
    if (VIEW.idx != null) { if (e.key === 'Escape') closeLight(); if (e.key === 'ArrowRight') stepLight(1); if (e.key === 'ArrowLeft') stepLight(-1); return; }
    if (e.key === 'Escape') closeViewer(); return;
  }
  if (e.key === 'Escape' && U.modal) return closeModal();
  if (e.target.closest('input,textarea,select')) return;
  const onClient = U.modal?.type === 'preview' || (U.role === 'clientA' && U.client.ok && !U.modal);
  if (!onClient || !document.querySelector('.ptabs')) return;
  const n = document.querySelectorAll('.ptab').length - 1;
  if (e.key === 'ArrowRight' && U.page < n) goPage(U.page + 1);
  if (e.key === 'ArrowLeft' && U.page > 0) goPage(U.page - 1);
});

if (!S) { S = seed(); commitSilent('최초 발행'); }
save(); render();
</script>
</body>
</html>
