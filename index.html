  } else if (m.type === 'hist') {
    const L = getL(m.lid), {full, hs} = histFor(m.lid);
    h = `<div class="modal wide"><div class="mh"><b>변경 이력</b><span class="sub">${esc(bInfo(L).name)} · ${esc(floorLabel(L.floors, L.leaseType))}</span><div class="sp"></div>${full ? '' : '<span class="chip">공개 항목만</span>'}<button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="mb">${histList(hs)}</div></div>`;
  } else if (m.type === 'tour') {
    const days = []; let d = S.today; while (days.length < 10) { d = addDays(d, 1); const w = new Date(d + 'T00:00:00').getDay(); if (w && w !== 6) days.push(d); }
    m.date = m.date || days[0]; m.slot = m.slot || '오후';
    h = `<div class="modal"><div class="mh"><b>현장 답사 요청</b><span class="sub">${esc(snapTitle(CP.pid, m.lid))}</span><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="mb">
      <div class="f"><label>희망 날짜</label><div class="days">${days.map(dd => `<button class="day ${m.date === dd ? 'on' : ''}" onclick="U.modal.date='${dd}';renderModal()"><span>${DOW[new Date(dd + 'T00:00:00').getDay()]}</span><b>${+dd.slice(8)}</b><small>${+dd.slice(5, 7)}월</small></button>`).join('')}</div></div>
      <div class="f" style="margin-top:16px"><label>시간대</label>${seg([['오전', '오전'], ['오후', '오후'], ['저녁', '저녁']], m.slot, "(v=>{U.modal.slot=v;renderModal()})")}</div>
      <div class="fg" style="margin-top:16px;grid-template-columns:110px 1fr"><div class="f"><label>인원</label><input class="in" type="number" min="1" value="${m.people || 2}" oninput="U.modal.people=+this.value"></div><div class="f"><label>메모</label><input class="in" value="${esc(m.memo || '')}" oninput="U.modal.memo=this.value" placeholder="예: 인테리어 업체 동행"></div></div>
      <div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="submitTour()">요청 보내기</button></div></div></div>`;
  } else if (m.type === 'dup') {
    const src = getP(m.pid);
    h = `<div class="modal"><div class="mh"><b>제안서 복제</b><span class="sub">${esc(src.clientName)} · 물건 ${src.items.length}건</span><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
      <form class="mb" onsubmit="event.preventDefault();createDup(this)"><input type="hidden" name="pid" value="${src.id}"><div class="fg" style="grid-template-columns:1fr 1fr">
      <div class="f"><label>새 클라이언트</label><select class="in" name="client" onchange="this.form.cname.disabled=this.value!=='other'"><option value="other">직접 입력</option>${clientOpts()}</select></div>
      <div class="f"><label>클라이언트명</label><input class="in" name="cname" placeholder="회사명"></div></div>
      <label class="chk"><input type="checkbox" name="keep" checked> 물건별 코멘트도 복사</label>
      <div class="sub" style="margin-top:8px">표지 요구조건과 물건 구성이 복사됩니다. 링크 · PIN · 응답 · 열람 기록은 새로 시작합니다.</div>
      <div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn pri">복제</button></div></form></div>`;
  } else if (m.type === 'preview') {
    const p = getP(m.pid);
    h = `<div class="modal full"><div class="mh" style="background:#fff"><b>클라이언트 화면</b><span class="sub">${linkOf(p)}</span><div class="sp"></div><button class="btn sm ghost" onclick="closeModal()">✕</button></div>${clientPage(p.snap, p.genAt, null, p.id, true)}</div>`;
  }
  root.innerHTML = `<div class="back" onclick="if(event.target===this)closeModal()">${h}</div>`;
  initMaps();
}
function polyClick(e) {
  const r = e.currentTarget.getBoundingClientRect();
  U.modal.pts.push([+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)]);
  renderModal();
}
function savePoly() { D.floors[U.modal.fi].poly = U.modal.pts; U.modal = null; renderModal(); render(); toast('영역 저장'); }

/* ---------- toast ---------- */
function toast(t, s) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `${esc(t)}${s ? `<small>${esc(s)}</small>` : ''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2800);
}
document.addEventListener('keydown', e => {
  if (VIEW) {
    if (VIEW.idx != null) { if (e.key === 'Escape') closeLight(); if (e.key === 'ArrowRight') stepLight(1); if (e.key === 'ArrowLeft') stepLight(-1); return; }
    if (e.key === 'Escape') closeViewer(); return;
  }
  if (e.key === 'Escape' && U.modal) return closeModal();
  if (e.target.closest('input,textarea,select')) return;
  const onClient = U.modal?.type === 'preview' || (isClient(U.role) && U.client.ok && !U.modal);
  if (!onClient || !document.querySelector('.ptabs')) return;
  const n = document.querySelectorAll('.ptab').length - 1;
  if (e.key === 'ArrowRight' && U.page < n) goPage(U.page + 1);
  if (e.key === 'ArrowLeft' && U.page > 0) goPage(U.page - 1);
});

if (!S) { S = seed(); commitSilent('최초 발행'); }
save(); render();
</script>
</body>
</html>
